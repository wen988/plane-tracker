/* 导航栏 */

nav .logo{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;color:#1d1d1f}
nav .logo svg{width:28px;height:28px}

nav .links{display:flex;gap:4px}
nav .links a{padding:8px 16px;border-radius:8px;color:#86868b;text-decoration:none;font-size:14px;font-weight:500}

nav .links a.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}

/* 主容器 */
.container{max-width:860px;margin:0 auto;padding:32px 24px}

/* 主功能区 */
.hero{text-align:center;padding:48px 0 32px}
.hero h1{font-size:32px;font-weight:800;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.hero .subtitle{font-size:15px;color:#86868b;margin-bottom:32px}

/* 输入区 */
.input-card{background:#fff;border-radius:20px;padding:32px;box-shadow:0 4px 24px rgba(99,102,241,.08);border:1px solid rgba(99,102,241,.1);max-width:680px;margin:0 auto}
.input-wrapper{display:flex;gap:12px;align-items:stretch}
.input-wrapper input{flex:1;padding:14px 20px;border:2px solid #e5e5ea;border-radius:14px;font-size:15px;outline:none;transition:all .2s;background:#fafafa}
.input-wrapper input:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.08)}
.input-wrapper input::placeholder{color:#c7c7cc}
.input-wrapper button{flex-shrink:0;padding:14px 32px;border:none;border-radius:14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.input-wrapper button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.35)}
.input-wrapper button:active{transform:translateY(0)}
.input-wrapper button:disabled{opacity:.6;cursor:not-allowed;transform:none}
.platform-hint{text-align:center;margin-top:12px;font-size:13px;color:#aeaeb2}
.platform-tag{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:20px;background:rgba(99,102,241,.08);color:#6366f1;font-size:12px;font-weight:600}

/* 状态指示 */
.status-box{text-align:center;margin:20px 0;display:none}
.status-box.show{display:block}
.spinner{display:inline-block;width:32px;height:32px;border:3px solid #e5e5ea;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-text{margin-top:12px;font-size:14px;color:#86868b}
.error-text{color:#ef4444;font-size:14px;margin-top:12px;display:none}
.error-text.show{display:block}

/* 结果展示区 */
.result-section{display:none;margin-top:24px}
.result-section.show{display:block}
.result-card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.06);display:flex;gap:24px;flex-wrap:wrap}
.result-left{flex:0 0 320px;max-width:100%}
.result-left video{width:100%;border-radius:12px;background:#000;max-height:400px}
.result-right{flex:1;min-width:260px;display:flex;flex-direction:column;gap:16px}
.result-right .video-title{font-size:17px;font-weight:700;color:#1d1d1f;line-height:1.5}
.author-row{display:flex;align-items:center;gap:10px}
.author-row img{width:36px;height:36px;border-radius:50%}
.author-row span{font-size:14px;color:#86868b}
.cover-preview{border-radius:12px;overflow:hidden;max-width:200px}
.cover-preview img{width:100%;display:block}
.btn-download{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none}
.btn-download.primary{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;width:100%}
.btn-download.primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,197,94,.35)}
.btn-download.secondary{background:#f5f5f7;color:#1d1d1f;width:100%;border:1px solid #e5e5ea}
.btn-download.secondary:hover{background:#ebebf0}

/* 广告位 */

.ad-banner.desktop{height:90px}
.ad-banner.mobile{height:50px;display:none}
.ad-banner .ad-label{letter-spacing:1px}

/* 特性区 */
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:48px 0}
.feature-card{background:#fff;border-radius:16px;padding:24px 16px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid #f5f5f7;transition:transform .2s}
.feature-card:hover{transform:translateY(-2px)}
.feature-icon{font-size:32px;margin-bottom:12px}
.feature-card h3{font-size:15px;font-weight:700;margin-bottom:4px;color:#1d1d1f}
.feature-card p{font-size:12px;color:#86868b}

/* 页脚 */

footer a{color:#6366f1;text-decoration:none}
footer a:hover{text-decoration:underline}
footer span{margin:0 8px;color:#d2d2d7}

/* 响应式 */
@media(max-width:768px){
  .hero{padding:24px 0 20px}
  .hero h1{font-size:24px}
  .input-card{padding:20px}
  .input-wrapper{flex-direction:column}
  .input-wrapper button{width:100%;padding:14px}
  .result-left{flex:1 1 100%}
  .features{grid-template-columns:repeat(2,1fr)}
  .ad-banner.desktop{display:none}
  .ad-banner.mobile{display:flex}
}
@media(max-width:480px){
  nav{padding:10px 12px}
  nav .logo span{font-size:15px}
  nav .links a{font-size:12px;padding:6px 10px}
}

<script>
// ========== 配置 ==========
const API_BASE = 'https://api.919667.xyz';

// ========== 平台检测 ==========
const PLATFORM_PATTERNS = {
  '抖音': /douyin\.com|iesdouyin\.com|dy/,
  '快手': /kuaishou\.com|gifshow\.com/,
  'B站': /bilibili\.com|b23\.tv/,
  '小红书': /xiaohongshu\.com|xhslink\.com/,
  '微博': /weibo\.com/,
  '皮皮虾': /pipix\.com/,
  '西瓜视频': /ixigua\.com/,
  '微视': /weishi\.com/,
  '最右': /zuiyou\.com/,
  '美拍': /meipai\.com/
};

function detectPlatform(url) {
  for (const [name, pattern] of Object.entries(PLATFORM_PATTERNS)) {
    if (pattern.test(url)) return name;
  }
  return null;
}

// ========== 状态管理 ==========
function setLoading(isLoading) {
  const btn = document.getElementById('parseBtn');
  const statusBox = document.getElementById('statusBox');
  const errorText = document.getElementById('errorText');
  const resultSection = document.getElementById('resultSection');

  btn.disabled = isLoading;
  btn.textContent = isLoading ? '解析中...' : '解析视频';
  statusBox.classList.toggle('show', isLoading);
  errorText.classList.remove('show');
  if (isLoading) {
    resultSection.classList.remove('show');
  }
}

function showError(msg) {
  const errorText = document.getElementById('errorText');
  errorText.textContent = msg;
  errorText.classList.add('show');
  setTimeout(() => errorText.classList.remove('show'), 5000);
}

function showResult(data) {
  const section = document.getElementById('resultSection');
  section.classList.add('show');

  document.getElementById('videoTitle').textContent = data.title || '无标题';

  // 作者信息
  const avatar = document.getElementById('authorAvatar');
  if (data.author && data.author.avatar) {
    avatar.src = data.author.avatar;
    avatar.style.display = 'block';
  } else {
    avatar.style.display = 'none';
  }
  document.getElementById('authorName').textContent = (data.author && data.author.name) ? data.author.name : '';

  // 封面
  if (data.cover_url) {
    document.getElementById('coverImage').src = data.cover_url;
    document.getElementById('coverPreview').style.display = 'block';
  }

  // 视频播放器
  const videoPlayer = document.getElementById('videoPlayer');
  if (data.video_url) {
    videoPlayer.src = data.video_url;
    videoPlayer.style.display = 'block';
  }

  // 下载按钮
  document.getElementById('downloadVideo').href = data.video_url || '#';
  document.getElementById('downloadMusic').href = data.music_url || '#';

  // 滚动到结果区
  section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ========== 解析逻辑 ==========
async function parseVideo() {
  const input = document.getElementById('urlInput');
  const url = input.value.trim();

  if (!url) {
    showError('请输入视频分享链接');
    input.focus();
    return;
  }

  if (!/^https?:\/\//.test(url)) {
    showError('请输入有效的链接地址（以 http:// 或 https:// 开头）');
    return;
  }

  setLoading(true);

  try {
    const apiUrl = `${API_BASE}?url=${encodeURIComponent(url)}`;
    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const data = await response.json();

    // Worker 返回的 error 字段
    if (data.error) {
      throw new Error(data.error);
    }

    if (!data.video_url && (!data.images || data.images.length === 0)) {
      throw new Error('未获取到视频地址');
    }

    showResult(data);
  } catch (err) {
    showError('解析失败，请检查链接是否正确或稍后重试');
    console.error('解析错误:', err);
  } finally {
    setLoading(false);
  }
}

// ========== 事件绑定 ==========
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('urlInput');

  // 自动聚焦
  input.focus();

  // 回车触发解析
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') parseVideo();
  });

  // 粘贴后检测平台
  input.addEventListener('input', () => {
    const val = input.value.trim();
    const hint = document.getElementById('platformHint');
    const platform = detectPlatform(val);
    if (platform) {
      hint.innerHTML = `<span class="platform-tag">已识别：${platform}</span>`;
    } else if (val) {
      hint.innerHTML = '<span style="color:#aeaeb2;font-size:12px">粘贴链接后可自动识别平台</span>';
    } else {
      hint.innerHTML = '';
    }
  });
});
</script>
