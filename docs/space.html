<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex">
<title>太空过境 · ISS & Starlink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0a1a;color:#e0e0e0}
nav{display:flex;background:rgba(20,20,40,.85);backdrop-filter:blur(20px);padding:12px 24px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;z-index:100}
nav a{padding:8px 20px;border-radius:8px;color:#86868b;text-decoration:none;font-size:14px;font-weight:500;margin-right:4px;transition:all .2s}
nav a:hover{background:rgba(255,255,255,.06);color:#e0e0e0}
nav a.on{background:#0071e3;color:#fff}
.container{max-width:1100px;margin:0 auto;padding:24px}
.header{margin-bottom:24px}
.header h1{font-size:28px;font-weight:700}
.header .ts{font-size:13px;color:#86868b;margin-top:4px}
.location-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,113,227,.15);border:1px solid rgba(0,113,227,.3);border-radius:20px;padding:6px 16px;font-size:13px;color:#0071e3;margin-top:8px}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col-card{background:rgba(20,20,40,.6);border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(12px)}
.col-card h2{font-size:20px;font-weight:700;margin-bottom:4px}
.col-card .subtitle{font-size:12px;color:#86868b;margin-bottom:20px}
.pass-card{background:rgba(255,255,255,.03);border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.05);transition:all .2s}
.pass-card:hover{background:rgba(255,255,255,.06)}
.pass-card.highlight{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.25);box-shadow:0 0 20px rgba(0,255,136,.06)}
.pass-card .pass-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pass-card .pass-time{font-size:16px;font-weight:700;color:#00d4ff}
.pass-card .pass-badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.pass-card .pass-badge.good{background:rgba(0,255,136,.15);color:#00ff88}
.pass-card .pass-badge.normal{background:rgba(255,255,255,.05);color:#86868b}
.pass-details{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:12px;color:#a0a0a0}
.pass-details span b{display:block;font-size:13px;color:#e0e0e0;margin-bottom:2px}
.loading{text-align:center;padding:40px;color:#86868b}
.loading .spinner{display:inline-block;width:24px;height:24px;border:2px solid rgba(255,255,255,.1);border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{text-align:center;padding:40px;color:#ff6b6b;font-size:14px}
.no-data{text-align:center;padding:40px;color:#86868b}
.legend{font-size:12px;color:#86868b;margin-top:16px;padding:12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04)}
.legend span{margin-right:16px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.legend .dot.high{background:#00ff88}
.legend .dot.low{background:#86868b}
</style></head><body>
<nav>
  <a href="index.html">飞机追踪</a>
  <a href="weather.html">气象仪表盘</a>
  <a href="3d.html">3D地球</a>
  <a href="replay.html">历史回放</a>
  <a class="on" href="space.html">太空过境</a>
</nav>
<div class="container">
<div class="header">
  <h1>太空过境提醒</h1>
  <div class="ts">ISS 国际空间站 · Starlink 星链卫星 | 观测位置: 藁城</div>
  <div class="location-badge">📍 37.94°N, 114.84°E · 藁城, 河北</div>
</div>
<div class="legend">
  <span><span class="dot high"></span> 高仰角过境 (＞45°) — 适合观测</span>
  <span><span class="dot low"></span> 低仰角过境 — 可见但角度低</span>
  <span>数据来源: N2YO.com | 未来5次过境预报</span>
</div>
<div class="columns">
  <div class="col-card" id="issCol">
    <h2>🛰 ISS 国际空间站</h2>
    <div class="subtitle">NORAD ID: 25544</div>
    <div class="loading" id="issLoading"><span class="spinner"></span>正在获取过境数据...</div>
    <div id="issContent"></div>
  </div>
  <div class="col-card" id="starlinkCol">
    <h2>🛰 Starlink-1007 星链</h2>
    <div class="subtitle">NORAD ID: 44713</div>
    <div class="loading" id="slLoading"><span class="spinner"></span>正在获取过境数据...</div>
    <div id="slContent"></div>
  </div>
</div>
</div>
<script>
var API_KEY='DEMO';
var LAT=37.94,LON=114.84,ALT=0,DAYS=5,MIN_ELEV=70;

function fetchPasses(noradId,loadingEl,contentEl,highlight){
  var url='https://api.n2yo.com/rest/v1/satellite/radiopasses/'+noradId+'/'+LAT+'/'+LON+'/'+ALT+'/'+DAYS+'/'+MIN_ELEV+'/&apiKey='+API_KEY;
  fetch(url).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    loadingEl.style.display='none';
    var passes=data.passes||[];
    if(passes.length===0){contentEl.innerHTML='<div class="no-data">未来5天内无明显过境</div>';return;}
    var html='';
    passes.forEach(function(p){
      var startUTC=p.startUTC;
      var endUTC=p.endUTC;
      var maxEl=p.maxEl||0;
      var startAz=p.startAz||0;
      var startAzCompass=p.startAzCompass||'';
      var maxAz=p.maxAz||0;
      var maxAzCompass=p.maxAzCompass||'';
      var mag=p.mag||0;
      var isHighlight=maxEl>45;
      var dateObj=new Date(startUTC*1000);
      var dateStr=dateObj.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'});
      var startTime=dateObj.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      var endDate=new Date(endUTC*1000);
      var endTime=endDate.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      html+='<div class="pass-card'+(isHighlight?' highlight':'')+'">'+
        '<div class="pass-header">'+
          '<span class="pass-time">'+dateStr+' '+startTime+' → '+endTime+'</span>'+
          '<span class="pass-badge '+(isHighlight?'good':'normal')+'">'+maxEl.toFixed(0)+'°</span>'+
        '</div>'+
        '<div class="pass-details">'+
          '<span><b>'+maxEl.toFixed(1)+'°</b>最大仰角</span>'+
          '<span><b>'+startAz.toFixed(0)+'° '+startAzCompass+'</b>起始方位</span>'+
          '<span><b>'+maxAz.toFixed(0)+'° '+maxAzCompass+'</b>峰值方位</span>'+
          '<span><b>'+mag.toFixed(1)+'</b>亮度 (星等)</span>'+
        '</div>'+
      '</div>';
    });
    contentEl.innerHTML=html;
  }).catch(function(e){
    loadingEl.style.display='none';
    contentEl.innerHTML='<div class="error">获取数据失败: '+e.message+'<br><small>N2YO DEMO key 可能已超限，请稍后重试</small></div>';
  });
}

fetchPasses(25544,document.getElementById('issLoading'),document.getElementById('issContent'));
fetchPasses(44713,document.getElementById('slLoading'),document.getElementById('slContent'));
</script></body></html>
