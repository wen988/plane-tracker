<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex">
<title>航班历史回放</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f7;color:#1d1d1f}
.lock{position:fixed;inset:0;background:rgba(245,245,247,.97);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(20px)}
.lock input{padding:12px 20px;border-radius:12px;border:1.5px solid #d2d2d7;background:#fff;font-size:16px;width:260px;text-align:center;outline:none}
.lock input:focus{border-color:#0071e3}
.lock button{margin-top:10px;padding:10px 36px;border-radius:20px;border:none;background:#0071e3;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.lock .err{color:#ff3b30;font-size:13px;margin-top:8px;display:none}
nav{display:flex;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);padding:12px 24px;border-bottom:1px solid #d2d2d7;position:sticky;top:0;z-index:100}
nav a{padding:8px 20px;border-radius:8px;color:#86868b;text-decoration:none;font-size:14px;font-weight:500;margin-right:4px}
nav a:hover{background:rgba(0,0,0,.04);color:#1d1d1f}
nav a.on{background:#0071e3;color:#fff}
.container{max-width:1200px;margin:0 auto;padding:24px}
.header{margin-bottom:20px}
.header h1{font-size:28px;font-weight:700}
.header .ts{font-size:13px;color:#86868b;margin-top:4px}
.controls{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.controls button{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;background:#0071e3;color:#fff;transition:background .2s}
.controls button:hover{background:#005bb5}
.controls button:disabled{background:#c7c7cc;cursor:not-allowed}
.controls input[type=range]{flex:1;min-width:200px;accent-color:#0071e3}
.controls .time-label{font-size:14px;font-weight:600;color:#1d1d1f;min-width:160px;text-align:center}
.controls .speed-select{padding:8px 12px;border-radius:8px;border:1.5px solid #d2d2d7;font-size:13px;outline:none;background:#fff}
#map{height:450px;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px}
.plane-list{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.plane-list h3{font-size:15px;font-weight:600;margin-bottom:12px;color:#1d1d1f}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;color:#86868b;font-weight:500;border-bottom:1px solid #e5e5ea}
td{padding:8px 12px;border-bottom:1px solid #f5f5f7}
tr:hover td{background:#f5f5f7}
.loading{text-align:center;padding:40px;color:#86868b;font-size:15px}
</style></head><body>
<div class="lock" id="lock"><div style="font-size:40px;margin-bottom:8px">⏪</div>
<div style="font-size:15px;color:#86868b;margin-bottom:16px">航班历史回放</div>
<input type="password" id="pw" placeholder="输入密码" onkeydown="if(event.key==='Enter')unlock()">
<button onclick="unlock()">解锁</button><div class="err" id="err">密码错误</div></div>
<nav>
  <a href="index.html">飞机追踪</a>
  <a href="weather.html">气象仪表盘</a>
  <a href="3d.html">3D地球</a>
  <a class="on" href="replay.html">历史回放</a>
  <a href="space.html">太空过境</a>
</nav>
<div class="container" id="main" style="display:none">
<div class="header"><h1>航班历史回放</h1><div class="ts" id="statusLine">正在加载快照数据...</div></div>
<div class="controls">
  <button id="btnPrev" onclick="stepPrev()" title="上一步">◀</button>
  <button id="btnPlay" onclick="togglePlay()">▶ 播放</button>
  <button id="btnNext" onclick="stepNext()" title="下一步">▶</button>
  <input type="range" id="timeline" min="0" max="0" value="0" oninput="seekTimeline()">
  <span class="time-label" id="timeLabel">--</span>
  <select class="speed-select" id="speedSelect" onchange="changeSpeed()">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x (1秒/帧)</option>
    <option value="2">2x</option>
  </select>
  <span class="time-label" id="planeCountLabel">飞机: --</span>
</div>
<div id="map"></div>
<div class="plane-list"><h3>当前时刻飞机列表</h3>
<table><thead><tr><th>呼号</th><th>ICAO24</th><th>来源国</th><th>高度(m)</th><th>速度(m/s)</th><th>航向</th><th>状态</th></tr></thead><tbody id="planeTableBody"><tr><td colspan="7" style="text-align:center;color:#86868b">--</td></tr></tbody></table></div>
</div>
<div class="loading" id="loading" style="display:none">正在加载快照列表...</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var snapshots=[], currentIndex=0, playing=false, playTimer=null, map, markers=[];
var startDate=new Date('2026-07-22'), today=new Date('2026-07-23');

function unlock(){crypto.subtle.digest("SHA-256",new TextEncoder().encode(document.getElementById("pw").value)).then(function(h){var x=Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");if(x==="ed9b7dfe821ab674871bc9244d80bae4e8d6dbe5122f34247b8c2854e6cc525e"){document.getElementById("lock").style.display="none";document.getElementById("main").style.display="block";initMap();loadSnapshots();}else{document.getElementById("err").style.display="block"}})}

function initMap(){
  map=L.map("map").setView([37.94,114.84],7);
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{attribution:'&copy; Esri',maxZoom:18}).addTo(map);
}

function dateStr(d){return d.toISOString().slice(0,10);}

function loadSnapshots(){
  var dates=[], d=new Date(startDate);
  while(d<=today){dates.push(dateStr(new Date(d)));d.setDate(d.getDate()+1);}
  var total=dates.length, loaded=0;
  dates.forEach(function(ds){
    fetch('../data/snapshot-'+ds+'.json').then(function(r){
      if(r.ok)return r.json();
      throw new Error('skip');
    }).then(function(data){
      data._date=ds;
      snapshots.push(data);
    }).catch(function(){}).finally(function(){
      loaded++;
      if(loaded===total)onSnapshotsReady();
    });
  });
}

function onSnapshotsReady(){
  snapshots.sort(function(a,b){return a._date.localeCompare(b._date)||(a.timestamp||'').localeCompare(b.timestamp||'');});
  if(snapshots.length>200){
    var step=Math.ceil(snapshots.length/200);
    var sampled=[];
    for(var i=0;i<snapshots.length;i+=step)sampled.push(snapshots[i]);
    snapshots=sampled;
  }
  document.getElementById("statusLine").textContent='已加载 '+snapshots.length+' 个快照';
  document.getElementById("timeline").max=snapshots.length-1;
  document.getElementById("timeline").value=0;
  currentIndex=0;
  if(snapshots.length>0)showSnapshot(0);
}

function showSnapshot(idx){
  currentIndex=idx;
  document.getElementById("timeline").value=idx;
  var s=snapshots[idx];
  document.getElementById("timeLabel").textContent=s._date+' '+(s.timestamp||'--');
  document.getElementById("planeCountLabel").textContent='飞机: '+(s.planes?s.planes.length:0);
  clearMarkers();
  var planes=s.planes||[];
  var rows='';
  planes.forEach(function(p){
    var cs=p.callsign||'N/A',icao=p.icao24||'-',cty=p.origin_country||'-';
    var alt=p.altitude||0,vel=p.velocity||0,trk=p.track||0;
    var og=p.on_ground?'地面':'空中';
    rows+='<tr><td>'+cs+'</td><td>'+icao+'</td><td>'+cty+'</td><td>'+alt.toFixed(0)+'</td><td>'+vel.toFixed(0)+'</td><td>'+trk.toFixed(0)+'°</td><td>'+og+'</td></tr>';
    if(p.latitude&&p.longitude){
      var ic=L.divIcon({html:'<div style="font-size:18px;transform:rotate('+trk+'deg)">✈</div>',className:"",iconSize:[22,22],iconAnchor:[11,11]});
      var m=L.marker([p.latitude,p.longitude],{icon:ic}).addTo(map);
      m.bindPopup('<b>'+cs+'</b> ('+icao+')<br>高度:'+alt.toFixed(0)+'m<br>速度:'+vel.toFixed(0)+'m/s');
      markers.push(m);
    }
  });
  document.getElementById("planeTableBody").innerHTML=rows||'<tr><td colspan="7" style="text-align:center;color:#86868b">无数据</td></tr>';
}

function clearMarkers(){markers.forEach(function(m){map.removeLayer(m);});markers=[];}

function stepNext(){if(currentIndex<snapshots.length-1)showSnapshot(currentIndex+1);}
function stepPrev(){if(currentIndex>0)showSnapshot(currentIndex-1);}

function seekTimeline(){var idx=parseInt(document.getElementById("timeline").value);showSnapshot(idx);}

function togglePlay(){
  if(playing){stopPlay();return;}
  playing=true;
  document.getElementById("btnPlay").textContent='⏸ 暂停';
  var speed=parseFloat(document.getElementById("speedSelect").value)||1;
  var interval=Math.round(1000/speed);
  function tick(){
    if(!playing)return;
    if(currentIndex<snapshots.length-1){showSnapshot(currentIndex+1);playTimer=setTimeout(tick,interval);}
    else{stopPlay();}
  }
  playTimer=setTimeout(tick,interval);
}

function stopPlay(){
  playing=false;
  document.getElementById("btnPlay").textContent='▶ 播放';
  if(playTimer){clearTimeout(playTimer);playTimer=null;}
}

function changeSpeed(){if(playing){stopPlay();togglePlay();}}
</script></body></html>
