<style>

<body>

<textarea id="questionInput" placeholder="默念你想问的问题..." maxlength="200"></textarea>
<br><button class="btn btn-primary" onclick="submitQuestion()">开 始 占 卜</button>
</div>
<div id="spreadScreen" class="spread-screen hidden">
<div class="section-title">选择你的牌阵</div>
<div class="spread-options">

<div class="spread-card" onclick="selectSpread('three')"><div class="spread-name">三张牌阵</div><div class="spread-desc">过去 · 现在 · 未来，看清时间脉络</div><div class="spread-count">3 张牌</div></div>
<div class="spread-card" onclick="selectSpread('cross')"><div class="spread-name">五张十字牌阵</div><div class="spread-desc">现状·阻碍·过去·未来·对策，全方位解析</div><div class="spread-count">5 张牌</div></div>
<div class="spread-card" onclick="selectSpread('celtic')"><div class="spread-name">凯尔特十字</div><div class="spread-desc">完整深度占卜，10张牌覆盖所有层面</div><div class="spread-count">10 张牌</div></div>
</div></div>

</div>
<div id="cardsScreen" class="cards-screen hidden"><div id="cardsContainer"></div><div class="cards-progress" id="cardsProgress"></div></div>
<div id="reportScreen" class="report-screen hidden"></div>
</div>

<script>

// ==================== 星空粒子 ====================
(function(){
  const c=document.getElementById('particles');
  const ctx=c.getContext('2d');
  function rs(){c.width=innerWidth;c.height=innerHeight;}
  rs();addEventListener('resize',rs);
  const n=Math.min(130,Math.floor(innerWidth*innerHeight/7000));
  const stars=Array.from({length:n},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.3,o:Math.random(),s:Math.random()*.3+.1,p:Math.random()*Math.PI*2}));
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    const t=Date.now()/1000;
    for(const s of stars){
      const a=s.o*(.4+.6*Math.sin(t*s.s+s.p));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(200,170,120,'+a.toFixed(2)+')';ctx.fill();
      if(Math.random()<.003){ctx.fillStyle='rgba(160,100,220,'+(a*.6).toFixed(2)+')';ctx.fill();}
    }
    requestAnimationFrame(draw);
  })();
})();

  celtic:{name:'凯尔特十字',count:10,positions:['现状核心','阻碍或助力','根源与过去','即将过去的影响','显意识目标','近未来','你的态度','环境影响','希望与恐惧','最终结果'],descs:['此刻你所处的核心情境','挡在你面前或推动你的力量','过去经历埋下的深层根源','近期即将消散的影响','你有意识追求的目标','不久的将来会发生的事','你对此事的态度与看法','周围人或环境对你的影响','内心深处的希望与恐惧','所有力量汇聚后的最终结果']}

{id:3,a:'major',n:'女皇',s:'\u{1F451}',nm:'III',uk:'丰饶|母性|感官之美|创造力',rk:'依赖|空虚|创造力枯竭|忽视自我',
 up:'女皇端坐于丰收麦田之间，象征物质与精神的丰饶。她召唤你拥抱生活中的感官之美，滋养自己与他人。创造力如春天般蓬勃发展，这是享受成果、孕育新生的季节。',
 rv:'逆位女皇提示过度关注外界而忽略自我滋养。关系中可能变得依赖他人，或创造力遭遇阻滞。回归内在花园，先灌溉自己的心灵土壤。',
 lu:'正位预示感情进入温暖甜蜜的稳定期，双方互相滋养，爱意自然流淌。享受此刻。',lr:'逆位提醒感情中可能过度依赖对方而失去自我，或在关系中感到被忽视。',
 cu:'正位代表创意的丰收期，艺术与设计类工作特别顺利。你的作品将获得认可。',cr:'逆位警示创意枯竭或工作成果不被欣赏。给自己放个假，灵感需要空间。',
 fu:'正位暗示财运亨通，享受物质丰裕的果实。也是适合购买心仪物品犒赏自己的时候。',fr:'逆位提醒避免过度消费填补内心空虚，或对财务过度依赖他人。独立管理。',
 hu:'正位鼓励通过自然疗法和美食滋养身体。身心都处于舒适平衡的状态。',hr:'逆位提醒注意放纵带来的健康问题，或忽视身体对休息的需求。',
 ru:'正位预示你将成为朋友圈中的温暖源泉，慷慨大方让你的人气飙升。',rr:'逆位提醒小心过度付出被当成理所当然，学会设立健康的人际边界。'},
{id:4,a:'major',n:'皇帝',s:'\u{1F934}',nm:'IV',uk:'权威|秩序|领导力|稳定结构',rk:'专制|失控|缺乏自律|权威滥用',
 up:'皇帝端坐王座之上，象征秩序、权威与稳固的力量。用理性与纪律行事，建立清晰目标与架构。握紧权杖，勇敢担当，你将赢得尊重并掌控全局。',
 rv:'逆位皇帝暗示权力滥用或秩序的崩溃。你可能面对一个专制的权威，或自身陷入混乱无法自控。重新审视规则，找到灵活而坚定的方式。',
 lu:'正位暗示关系中一方承担了主导与保护角色。这段感情有稳定的基础和明确的方向。',lr:'逆位提醒关系中可能存在控制欲过强的问题。平等是健康关系的前提。',
 cu:'正位预示晋升或承担领导角色的机会。你的管理能力和决断力将被看到。',cr:'逆位警示与上级的冲突或自身管理混乱。检视自己的领导风格是否过于僵硬。',
 fu:'正位代表财务结构稳固，适合做长期投资和资产配置。按规则行事必有回报。',fr:'逆位提醒避免因权力欲做出冒险财务决策，或遭遇权威人物的财务压制。',
 hu:'正位鼓励用纪律和规律的生活作息改善健康。自律带来自由。',hr:'逆位提醒压力过大导致的身心问题。过度的控制欲正在消耗你的能量。',
 ru:'正位预示在群体中建立威信，你的意见受到尊重。适合担任组织者角色。',rr:'逆位提醒小心因强势态度疏远他人。权威感过了头就变成压迫感。'},
{id:5,a:'major',n:'教皇',s:'\u{1F4FF}',nm:'V',uk:'信仰|传统|导师|精神指引',rk:'打破传统|教条|盲目追随|精神空虚',
 up:'教皇是智慧与传统价值的守护者。寻求导师的指引，或遵循内心深处的信仰体系。通过仪式和学习，你将获得更高层次的精神启蒙。顺应正道而行。',
 rv:'逆位教皇鼓励打破陈旧信仰框架和传统束缚，寻找属于自己的精神道路。质疑权威，倾听内心真实声音而非他人告诉你的正确。',
 lu:'正位暗示一段有共同价值观和信仰基础的关系，或通过长辈介绍认识对象。',lr:'逆位提醒不要被传统婚恋观念绑架。你的感情不需要活在他人的期待里。',
 cu:'正位鼓励参加培训或寻求资深导师指导。按部就班地晋升，稳定可靠。',cr:'逆位警示对现有工作制度不满，或感到组织僵化限制了你的发展。',
 fu:'正位代表通过传统理财方式和稳健投资获利。遵守规则，细水长流。',fr:'逆位提醒打破传统理财观念，尝试新的财富模式，但不要走极端。',
 hu:'正位鼓励遵循专业医生的指导，传统养生方法对你有益。',hr:'逆位提醒不要盲从流行但不科学的健康潮流。多方核实信息来源。',
 ru:'正位预示在社群中找到志同道合的伙伴，共同的信仰凝聚人心。',rr:'逆位提醒小心被团体或教条束缚了独立思考。保持批判精神。'},
{id:6,a:'major',n:'恋人',s:'\u{1F495}',nm:'VI',uk:'爱情|和谐|选择|灵魂契约',rk:'分离|失衡|错误选择|价值观冲突',
 up:'恋人不仅是爱情，更象征人生重大抉择。你正面临需要心灵与理性合一的选择。听从真实渴望，做出与灵魂契合的决定。真挚关系将带来深刻成长。',
 rv:'逆位恋人暗示关系中的不和谐或价值观冲突。你正回避艰难抉择，或陷入诱惑与背叛的困境。停下脚步审视真正珍视的东西。',
 lu:'正位预示真挚爱情的降临或关系升华。这是确认彼此心意的最佳时机，勇敢表白。',lr:'逆位提醒感情中的裂痕、三角关系或价值观不合。需要做出艰难但必要的抉择。',
 cu:'正位暗示事业上的理想合作或完美搭档出现。选择你真正热爱的方向。',cr:'逆位警示合作关系的破裂或职业方向上的摇摆不定。审视你的核心价值观。',
 fu:'正位代表因合作或正确的选择带来财富增长。你的价值观与赚钱方式是统一的。',fr:'逆位提醒避免因诱惑做出违背原则的财务决定。金钱与人性的考验正在发生。',
 hu:'正位鼓励身心合一的生活方式，选择的健康计划是你真正享受的。',hr:'逆位提醒在多个健康方案中摇摆不定，难以坚持。选一个就坚定执行。',
 ru:'正位预示一段重要的人际关系进入深化阶段。真诚的连接胜过数量。',rr:'逆位提醒人际中的选择困难，或与密友产生价值观层面的冲突。'},
{id:7,a:'major',n:'战车',s:'\u{1F6E1}\u{FE0F}',nm:'VII',uk:'胜利|意志力|征服|决心',rk:'失控|冲突|挫折|方向迷失',
 up:'战车轰鸣前行，代表不可阻挡的意志与行动力。你已驾驭内心对立的二元力量，朝目标坚定推进。凭借勇气和专注，任何障碍都挡不住你。胜利在望。',
 rv:'逆位战车意味前进道路上出现阻力，可能感到方向迷失或内心被冲突撕扯。控制欲太强反导致失控。暂停进攻，重整旗鼓再出发。',
 lu:'正位预示主动追求和热烈表达将赢得爱情。勇敢出击，你的魅力势不可挡。',lr:'逆位提醒感情中的冲突失控，或追得太急吓跑对方。放慢速度给彼此空间。',
 cu:'正位代表事业上的突破时刻，用决心和行动力扫除障碍。升职或跳槽的好时机。',cr:'逆位警示职场上的挫败或与同事的恶性竞争。急于求成反而南辕北辙。',
 fu:'正位暗示通过努力和竞争获得的财务回报。你的进取心就是最大的财富发动机。',fr:'逆位提醒避免因急躁做出错误投资，或与人在金钱上产生激烈冲突。',
 hu:'正位鼓励用意志力克服健康挑战。运动和自律将带来明显的效果。',hr:'逆位提醒过度训练或身心透支。停下来，身体并非永动机。',
 ru:'正位预示在竞争环境中脱颖而出，赢得尊重。你的决心感染身边的人。',rr:'逆位提醒好胜心可能伤害亲密关系。合作比对抗走得更远。'},
{id:8,a:'major',n:'力量',s:'\u{1F981}',nm:'VIII',uk:'勇气|内在力量|耐心|以柔克刚',rk:'软弱|恐惧|自我怀疑|失控',
 up:'力量描绘的不是外部蛮力，而是内在的坚韧与温柔驯服。你拥有以柔克刚的智慧，用耐心驯服内心野兽。真正的力量来源于对自己全然的接纳与信任。',
 rv:'逆位力量暗示自信低谷，被恐惧与不安全感支配。可能感到无力掌控局面，或过度压抑本能导致爆发。重新连结你的内在力量源泉。',
 lu:'正位预示用温柔和耐心赢得爱情。真正的吸引力来自内心的自信与从容。',lr:'逆位提醒感情中的不安全感正在吞噬你的魅力。先爱上自己，才能被爱。',
 cu:'正位代表用韧性和专业实力克服困难。不张扬但稳扎稳打的你正在赢得尊重。',cr:'逆位警示对工作能力产生怀疑，或被压力压得喘不过气。你比自己想象的更强。',
 fu:'正位暗示财务需要耐心与节制。不要追涨杀跌，内在定力就是财富基石。',fr:'逆位提醒因恐惧做出非理性财务决定，或被短期波动吓到退出。稳住。',
 hu:'正位鼓励用温和持续的方式改善健康，如瑜伽、冥想。身心的柔韧性在增强。',hr:'逆位提醒长期压抑的负面情绪正在损害健康。找到健康的释放渠道。',
 ru:'正位预示以温和但坚定的方式处理人际矛盾。你的包容会化解敌意。',rr:'逆位提醒可能在关系中变得退缩或被动攻击，正视冲突而非逃避。'},
{id:9,a:'major',n:'隐者',s:'\u{1F3EE}',nm:'IX',uk:'内省|孤独|智慧|寻求真理',rk:'孤立|恐惧独处|逃避现实|过度内省',
 up:'隐者持灯独行于黑暗中，照亮内心最深处真实。此刻你需要暂时退隐，在孤独中寻找内在智慧和答案。沉默与沉思将带给你远超喧嚣世界的启迪。',
 rv:'逆位隐者警示过度孤立可能变为逃避。或因恐惧社交而封闭自己，或沉溺内省丧失行动力。让内心智慧之光照入现实世界。',
 lu:'正位暗示需要独处时间想清楚感情需求，或遇见一位成熟且有智慧的对象。',lr:'逆位提醒你正在因为孤独而将就，或回避必要的感情沟通。走出自己的壳。',
 cu:'正位鼓励深入学习与专业精进，暂时的低调是为了更耀眼的回归。',cr:'逆位警示过度孤立导致错失合作机会。专业知识需要分享才有价值。',
 fu:'正位暗示通过深度研究和耐心等待获得的财务回报。不要跟风，走自己的路。',fr:'逆位提醒因封闭心态错失投资信息或合作机会。偶尔抬头看看市场。',
 hu:'正位鼓励通过独处和冥想恢复身心能量。远离喧嚣让身体自我修复。',hr:'逆位提醒长期与世隔绝的生活方式可能损害健康。适度社交是良药。',
 ru:'正位预示真正的知己不需要数量，一两个灵魂之交足矣。',rr:'逆位提醒过度自我封闭导致的孤独。主动联系一个老朋友吧。'},
{id:10,a:'major',n:'命运之轮',s:'\u{2638}\u{FE0F}',nm:'X',uk:'命运|转折点|机遇|因果',rk:'厄运|抗拒改变|恶性循环|时机未到',
 up:'命运之轮永不停歇地旋转，带来无法抗拒的改变与转机。重大的命运转折正在发生。顺应宇宙的流动，幸运女神正向你微笑。一切际遇都有其因果与时机。',
 rv:'逆位命运之轮暗示你正遭遇一段低谷周期，事情总在与你作对。你可能抗拒不可阻挡的变化。接受这是命运循环的一部分，黎明终将到来。',
 lu:'正位预示命运安排的邂逅，一段缘分正在到来。顺应发展，不要用力过猛。',lr:'逆位提醒感情进入瓶颈期，或反复纠缠同一类问题。打破循环需要勇气。',
 cu:'正位代表转机来临，升迁或跳槽的时机已经成熟。好运站在你这边。',cr:'逆位警示职场运势下行，或反复遇到相似挫折。从过往经验中寻找突破口。',
 fu:'正位暗示财运的重大转折，可能是意外之财或投资回报的爆发期。',fr:'逆位提醒财务周期的低谷，避免孤注一掷。运势会回来的，先守住。',
 hu:'正位预示身体状况的周期性好转，慢性问题有望迎来转机。',hr:'逆位提醒健康问题的反复，或旧疾复发。耐心治疗，这是恢复周期的一部分。',
 ru:'正位暗示命运将重要的人送入你的生命。珍惜那些刚好遇见的缘分。',rr:'逆位提醒人际关系的恶性循环。是时候主动终结消耗型的关系了。'},
{id:11,a:'major',n:'正义',s:'\u{2696}\u{FE0F}',nm:'XI',uk:'公正|真相|因果|责任',rk:'不公|逃避责任|偏见|失衡',
 up:'正义之剑悬于天平之上，宇宙依据因果法则做出裁决。真相即将大白，诚实和公平将得回报。承担你的责任，做出合乎良知的选择，结果将不偏不倚。',
 rv:'逆位正义警示偏袒、不公或逃避责任正在发生。或回避自己行为带来的后果，或被外界不公对待。真相可能被掩盖，主动捍卫公平。',
 lu:'正位预示一段公正和平衡的关系，或法律层面的感情事务得到公正解决。',lr:'逆位提醒感情中的不平等，一方付出过多而另一方理所当然。需要重新找平衡。',
 cu:'正位代表公正的考核结果和应得的奖励。你的努力即将得到对等的回报。',cr:'逆位警示职场中的不公待遇，或合同纠纷。收集证据，维护自己的权益。',
 fu:'正位暗示法律或合同相关的财务事宜将有公正的结果。欠款有望收回。',fr:'逆位提醒财务纠纷或税务问题。不要试图钻空子，因果不虚。',
 hu:'正位鼓励用公正客观的态度面对体检结果。良好的生活习惯将得到健康回报。',hr:'逆位提醒身体发出了不平衡的警告。审视生活习惯中的过度与欠缺。',
 ru:'正位预示人际中的公平交换，你的真诚将换来同等的善意。',rr:'逆位提醒在不平等的关系中继续消耗。勇敢表达你的诉求。'},
{id:12,a:'major',n:'倒吊人',s:'\u{1FAA2}',nm:'XII',uk:'牺牲|换个视角|放手|觉醒',rk:'停滞|无谓牺牲|固执|错失领悟',
 up:'倒吊人以颠倒视角看世界，是灵性觉醒的前奏。此刻的停滞与牺牲并非惩罚，而是让你以全新角度理解生命。放下掌控欲，臣服于当下，你将获得超越的智慧。',
 rv:'逆位倒吊人暗示陷入无法挣脱的停滞，或进行毫无意义的自我牺牲。可能拒绝从困境中汲取教训，顽固坚持旧视角。打破循环。',
 lu:'正位暗示为感情做出暂时的退让或等待。换个角度看这段关系，会有新的领悟。',lr:'逆位提醒不要在一段无望的感情中做无谓的牺牲。放手不是失败。',
 cu:'正位鼓励暂时的停歇重新审视职业方向。退一步看全局，比埋头赶路更重要。',cr:'逆位警示陷入职业停滞的挫败感中无法自拔。与其硬撑，不如主动求变。',
 fu:'正位暗示暂时的财务紧缩是为了未来的突破。换个角度审视资产配置。',fr:'逆位提醒不要再为没有回报的项目投入资金。及时止损是智慧。',
 hu:'正位鼓励用另类疗法或不寻常的角度处理健康问题。改变生活方式有奇效。',hr:'逆位提醒持续的亚健康状态需要彻底改变，而非不断贴创可贴。',
 ru:'正位暗示在人际冲突中退让一步，反而能看清全局并获得对方的尊重。',rr:'逆位提醒不要为了维持关系而不断牺牲自己。真正的朋友不需要你的委曲求全。'},
{id:13,a:'major',n:'死神',s:'\u{1F480}',nm:'XIII',uk:'结束|蜕变|新生|净化',rk:'抗拒改变|停滞|恐惧死亡|腐朽',
 up:'死神并非肉体消亡，而是旧我彻底终结与重生。一段关系、生活方式、旧有身份即将谢幕。勇敢接受告别，帷幕落下后新的太阳必将升起。',
 rv:'逆位死神意味拼命抗拒生命中必然的结束与蜕变。对失去的恐惧让你紧抓早已腐朽的事物。这种停滞只会延长痛苦。放下获得真正的自由。',
 lu:'正位预示一段不再服务你的感情即将结束，为新的真爱腾出空间。',lr:'逆位提醒你在死守一段已经枯竭的关系。恐惧分手让痛苦无限延长。',
 cu:'正位代表旧的工作模式或职位将被彻底改变。虽然痛苦，但这是重生的前兆。',cr:'逆位警示你在抗拒必要的职业转变。赖在舒适区只会让你越来越不舒服。',
 fu:'正位暗示旧的财务模式终结，破产或损失之后是全新的开始。坦然接受。',fr:'逆位提醒抱着亏损的投资不放只会更糟。断尾求生需要勇气。',
 hu:'正位预示不健康的生活方式将被彻底抛弃。戒断过程虽苦但换来新生。',hr:'逆位提醒你在回避必要的医疗干预或生活方式的彻底改变。',
 ru:'正位暗示一段有害关系的终结。虽然暂时孤单，但为更健康的关系挪出了空间。',rr:'逆位提醒你死守一段消耗型关系，害怕改变比改变本身更可怕。'},
{id:14,a:'major',n:'节制',s:'\u{1F30A}',nm:'XIV',uk:'平衡|调和|耐心|中庸之道',rk:'失衡|过度|缺乏节制|冲突',
 up:'节制天使将圣杯中的水在两极之间调和，象征平衡与融合的艺术。需要保持耐心，找到事物的中和点。避免极端，以温柔持续的方式达成目标。内心平静是最强大的力量。',
 rv:'逆位节制暗示生活天平正在倾斜。过度放纵、情绪失控或目标偏离正轨。重新寻回内心中心点，否则失衡将带来更严重后果。',
 lu:'正位预示感情进入平衡和谐阶段。双方找到了舒适的相处节奏，细水长流。',lr:'逆位提醒关系中的失衡——一方太热一方太冷。需要调整互动模式。',
 cu:'正位代表工作与生活的平衡状态。不急不躁，稳步推进的效率反而更高。',cr:'逆位警示工作过度或摸鱼过度，两个极端都在透支你的职业发展。',
 fu:'正位暗示财务上的均衡配置和稳健增长。不急功近利的策略带来长久回报。',fr:'逆位提醒消费或投资上的极端行为。反思一下是否在情绪化地用钱。',
 hu:'正位鼓励寻找生活中的平衡点，饮食运动作息都恰到好处。',hr:'逆位提醒身体的失衡信号，过度节食或暴饮暴食都需要调整。',
 ru:'正位预示人际关系的和谐期，给予和索取达到了完美的平衡。',rr:'逆位提醒在社交中过度迎合或过度自我，都让你失去真正的连接。'},
{id:15,a:'major',n:'恶魔',s:'\u{1F479}',nm:'XV',uk:'束缚|欲望|物质主义|阴影',rk:'解脱|觉醒|摆脱束缚|重新掌控',
 up:'恶魔揭示物质世界和欲望带来的束缚。你可能正被金钱、权力或不健康关系所困，但锁链的钥匙就在自己手中。直面内心阴影，承认束缚的存在，就能挣脱。',
 rv:'逆位恶魔是极具力量的突破之兆。你终于看清困住自己的枷锁并挣脱。脱离负面执念、重获自由的时刻。光明正穿透最深的阴影。',
 lu:'正位暗示对一段关系或某人的沉迷与执念。需要自问这是爱还是依赖。',lr:'逆位预示从一段束缚关系中解脱。你终于意识到自己值得更好的。',
 cu:'正位提醒你可能被金钱或地位捆绑，在不喜欢的工作中沉沦。醒来吧。',cr:'逆位代表从职场PUA或压榨中觉醒。是时候跳出不健康的工作环境了。',
 fu:'正位警示对金钱的过度执着正在反噬你。赚钱本身不是目的。',fr:'逆位预示从债务或财务执念中解脱。重新定义你与金钱的关系。',
 hu:'正位提醒成瘾行为正在损害你的健康。正视这个问题是治愈的起点。',hr:'逆位代表从不良习惯中挣脱，戒断成功在望。坚持住！',
 ru:'正位暗示一段有毒的依赖关系。你明知有害却无法抽身。',rr:'逆位预示切断消耗型关系的力量觉醒了。自由在向你招手。'},

{id:16,a:'major',n:'高塔',s:'\u{1F3F0}',nm:'XVI',uk:'突变|崩塌|启示|觉醒',rk:'避免灾难|恐惧改变|缓和的崩塌',
 up:'高塔在闪电中坍塌，象征突如其来的剧变和固有结构的瓦解。你可能经历一次令人震惊的冲击——信念崩塌、关系断裂或计划粉碎。但记住，只有倒掉不牢固的，才能建立真正坚实的地基。',
 rv:'逆位高塔暗示你正在拼命阻止一场不可避免的改变。虽然暂时延缓崩塌，但内在压力越来越大。或者你已挺过了最糟糕的部分，正在清理废墟准备重建。',
 lu:'正位预示感情中的突发变故，可能是分手或真相曝光。虽然痛苦，但这是必要的觉醒。',lr:'逆位提醒你正回避感情中的致命问题。拖延只会让最终的崩塌更惨烈。',
 cu:'正位代表职场中的突发动荡——裁员、项目取消或组织重组。做好Plan B。',cr:'逆位警示勉强维持的职场现状即将难以为继。主动改变比被动崩塌好。',
 fu:'正位暗示财务上的意外损失或投资暴雷。果断割肉，保留重建的资本。',fr:'逆位提醒你正对财务裂缝视而不见。趁还能补救，直面问题。',
 hu:'正位预示健康方面的突发问题，可能是长期忽视的结果。及时就医。',hr:'逆位提醒你在回避必要的体检或治疗。拖延只会让问题恶化。',
 ru:'正位暗示一段关系或友谊的突然破裂。接受事实，这是成长的必经之路。',rr:'逆位提醒你正勉强维系一个即将崩塌的人际结构。放手的勇气更重要。'},
{id:17,a:'major',n:'星星',s:'\u{2B50}',nm:'XVII',uk:'希望|疗愈|宁静|信念',rk:'绝望|不信|灰心|理想幻灭',
 up:'暴风雨过后，星星在夜空中静静闪烁。疗愈与新生已然开始。保持信念，宇宙正用温柔的星光指引你。敞开心扉接受疗愈的力量。最艰难的时刻已经过去。',
 rv:'逆位星星暗示希望感的流失。你可能正经历信念危机，对未来感到悲观。需要刻意寻找生活中的微光，哪怕只是一点。希望不是等来的，是主动去相信的。',
 lu:'正位预示经历感情低潮后的疗愈和新生。相信爱的可能性，新的希望就在前方。',lr:'逆位提醒对感情的失望可能让你丧失了信心。请相信，一颗心碎过并不代表永远。',
 cu:'正位代表创意和灵感的回归。经过低谷期，你将重新找到工作的热情和方向。',cr:'逆位警示对职业前景感到悲观。重新连接内在热情，回顾你出发的初心。',
 fu:'正位暗示财务状况正在从低谷中复苏。希望已经出现，坚持下去。',fr:'逆位提醒不要因暂时的财务困顿失去对未来的信心。星光虽弱，但足以指路。',
 hu:'正位预示身体和心灵的双重疗愈。恢复期已经到来，你会感觉越来越好。',hr:'逆位提醒对康复进程失去耐心的危险。身体有自己的节奏，给它时间。',
 ru:'正位暗示真诚的朋友会出现在你需要的时候。接受他人的关心和帮助。',rr:'逆位提醒你可能因为受伤而拒绝别人的好意。请打开一小扇门让温暖进入。'},
{id:18,a:'major',n:'月亮',s:'\u{1F31D}',nm:'XVIII',uk:'幻象|恐惧|潜意识|迷惑',rk:'真相揭露|克服恐惧|清晰|幻觉消散',
 up:'月亮洒下神秘而扭曲的光，现实与幻象的边界变得模糊。你正穿越潜意识的幽暗水域，恐惧与迷惑是旅程的伴随。不要相信表面所见，深入内心探索隐藏的真相。',
 rv:'逆位月亮意味迷雾正在散去，隐藏的恐惧和秘密即将被揭露。你开始看清之前迷惑你的幻象。这是一个逐步走出恐惧、找回清醒的过程。',
 lu:'正位暗示感情中的不确定和迷惑。你可能被自己的想象和恐惧支配，看不清真实。',lr:'逆位预示感情的迷雾散去了，真相终于清晰。不论好坏，知道就好。',
 cu:'正位提醒职场中可能有不透明的信息和隐藏的竞争。多观察，别轻信表象。',cr:'逆位代表隐藏的工作问题开始暴露。虽然棘手，但清晰总比模糊好。',
 fu:'正位警示财务上的迷惑和风险。不要被他人的承诺或短期利益蒙蔽。',fr:'逆位预示财务骗局或误导信息被揭穿。保护好自己的钱袋子。',
 hu:'正位提醒心理健康需要特别关注。焦虑、失眠或不明原因的情绪波动需要重视。',hr:'逆位代表心理迷雾的消散，之前的焦虑和不安开始找到根源和解决方案。',
 ru:'正位暗示人际关系中的不信任和猜疑。不要过度解读他人的言行。',rr:'逆位预示误会解除，人际中的暗流终于浮出水面并被处理。'},
{id:19,a:'major',n:'太阳',s:'\u{2600}\u{FE0F}',nm:'XIX',uk:'光明|成功|活力|喜悦',rk:'阴暗|沮丧|延迟成功|缺乏热情',
 up:'太阳升起，驱散一切迷雾。这张牌是最灿烂的祝福——成功、活力、纯粹的喜悦和温暖的清晰感。尽情享受当下的光芒和生命力。一切都在变好。',
 rv:'逆位太阳暗示暂时被乌云遮盖了光明。成功可能延迟但并未取消，或内在热情被压抑了。找回内心的那份纯粹快乐。',
 lu:'正位预示感情进入阳光明媚的阶段。亲密、温暖和毫无保留的喜悦充满你们之间。',lr:'逆位提醒暂时的感情低潮，不要放大问题。小乌云遮不住太阳。',
 cu:'正位代表事业上的辉煌成功和顺遂期。你被看见了，尽情发光发亮吧。',cr:'逆位提醒延迟的成功或暂时的低成就感。不要因为短期的挫折否定自己。',
 fu:'正位暗示财务的丰收期。之前的努力正在结出丰硕果实，享受回报。',fr:'逆位提醒暂时的财务不如意。保持积极，下一波好运就在转角处。',
 hu:'正位预示活力巅峰，身心健康都处在最佳状态。这份能量可以感染周围的人。',hr:'逆位提醒需要用积极的方式提振身心。走出去晒晒太阳就是最好的开始。',
 ru:'正位代表在人群中你是最受欢迎的存在。你的阳光能量自然吸引优秀的人。',rr:'逆位提醒不要独自消化负面情绪。与朋友分享快乐比独自闷闷不乐强大十倍。'},
{id:20,a:'major',n:'审判',s:'\u{1F514}',nm:'XX',uk:'召唤|重生|清算|觉醒',rk:'抗拒觉醒|评判|回避清算|内疚',
 up:'审判号角吹响，灵魂被召唤至最终的清算和觉醒。过往累积的一切正被精准称量。这是一个深刻的重生契机——回应内心的召唤，偿还因果债务，然后升入崭新层面。',
 rv:'逆位审判暗示你正抗拒必要的自我清算和改变。深陷内疚和对过往的悔恨中，无法向前。或回避内心清晰的召唤。是时候放下旧账，迎向新生了。',
 lu:'正位预示对感情的最终审视和决定。可能是复合、求婚或彻底告别。认真对待。',lr:'逆位提醒你正被旧情的纠葛和内疚捆绑。需要给自己一个交代然后往前。',
 cu:'正位代表职业生涯的关键转折。过往的成绩将被全面审视，重大决定在即。',cr:'逆位警示对职业生涯的逃避和犹豫。回避该做的决定只会让问题堆积。',
 fu:'正位暗示财务的最终清算期。过往的债务或投资将被全面盘点。认真面对。',fr:'逆位提醒对财务问题的回避和拖延。逃避账单和债务只会让情况更糟。',
 hu:'正位鼓励对身体做一次全面检视。是时候改变旧有的不良习惯了。',hr:'逆位提醒你在回避健康问题的警报。身体不会说谎，正视那些慢性信号。',
 ru:'正位暗示一段关系的因果将得到清算。善良会被回报，伤害会被呈现。',rr:'逆位提醒对人际中的旧怨耿耿于怀。放下评判，向前看才能轻松。'},
{id:21,a:'major',n:'世界',s:'\u{1F30D}',nm:'XXI',uk:'完成|圆满|实现|合一',rk:'未完成|停滞|缺角|拖延',
 up:'世界之舞圆满成环，象征一段生命周期的成功完成。所有元素完美融合，你抵达了心灵与物质统一的境界。这是收获和庆祝的时刻，也是下一个轮回的起点。',
 rv:'逆位世界暗示接近终点时的延迟或未完成感。就差最后一步却感到卡住了。审视那些被忽略的细节或尚未放手的旧包袱。圆满需要完整的交代。',
 lu:'正位预示感情的圆满达成，可能是美满结局或关系升华到新的阶段。',lr:'逆位提醒感情中的不完整感。可能有未了的心事阻碍你全身心投入。',
 cu:'正位代表某个大项目的成功收尾或职业目标的圆满实现。是庆祝和思考下一站的时刻。',cr:'逆位警示项目的最后一公里出了问题。不要仓促收尾，补足缺失的环节。',
 fu:'正位暗示长线投资的完美收网。财富的一轮循环圆满结束，准备进入下一轮。',fr:'逆位提醒财务目标的实现比预期慢，或最后一笔款项卡住了。耐心收尾。',
 hu:'正位预示身心达到和谐统一的巅峰状态。你的健康周期进入了最佳节点。',hr:'逆位提醒身体可能还差一步完全康复。不要急躁，给身体最后的完成时间。',
 ru:'正位暗示你在社交圈中完成了某种身份的确立。你被完整地看见和接纳。',rr:'逆位提醒人际关系中还缺一块拼图。也许你需要先完整自己。'},

{id:22,a:'minor',n:'权杖王牌',s:'\u{1F33F}',nm:'权杖1',uk:'新事业|灵感|潜能|行动',rk:'延误|错过机会|创意枯竭|方向错误',
 up:'一支燃烧的权杖引领全新开始。创意与激情充沛，这是启动新事业的完美时机。勇敢行动，火花已点燃。',rv:'逆位提醒新的开始遭遇延迟，或灵感之火熄灭。不要放弃，只是时机未到。',
 lu:'正位预示一段充满激情的新恋情即将被点燃，勇敢表白。',lr:'逆位提醒不要操之过急，热情需要匹配对方的节奏。',cu:'正位代表新事业或项目的启动信号，行动吧。',cr:'逆位提醒新项目需要更多准备，仓促上马可能翻车。',
 fu:'正位暗示新的收入来源或投资机会正在出现。',fr:'逆位提醒暂时不要冲动投入新项目，再观察一下。',hu:'正位鼓励开始新的健身或养生计划，充沛能量支持你。',hr:'逆位提醒身体可能不堪新计划的负荷。循序渐进。',
 ru:'正位预示新的友谊或社交圈开启，主动出击。',rr:'逆位提醒新的人际关系需要耐心培养，别用力过猛。'},
{id:23,a:'minor',n:'权杖二',s:'\u{1F30D}',nm:'权杖2',uk:'规划|远见|选择|掌控',rk:'犹豫|恐惧未来|受限|缺乏远见',
 up:'手握地球仪展望世界，有远见地规划未来。两个选择摆在面前，需要大胆决策。走出舒适区是成长的必经之路。',rv:'逆位暗示对未来的恐惧让你停滞不前。害怕离开安全区，或缺乏长远目标。',
 lu:'正位暗示对感情的长远规划，或面临两个追求者的选择。',lr:'逆位提醒你可能在逃避对感情的长期承诺。',cu:'正位代表职业规划的好时机，放眼更广阔的发展空间。',cr:'逆位警示对职业前景的迷茫和犹豫。',
 fu:'正位鼓励做长期财务规划，考虑海外投资或多元化布局。',fr:'逆位提醒不要因恐惧错过短期机会。大方向对就好。',hu:'正位预示为自己的健康制定一个长期可持续的计划。',hr:'逆位提醒你一直在计划但从未开始。行动吧。',
 ru:'正位暗示拓展社交视野，结交更广泛的人脉圈。',rr:'逆位提醒过度局限于现有圈子。出去走走。'},
{id:24,a:'minor',n:'权杖三',s:'\u{26F5}',nm:'权杖3',uk:'扩张|远航|贸易|领导力',rk:'挫折|计划受阻|失望|退回',
 up:'船只整装待发，远征已然启航。之前的计划进入执行阶段，收获在航海线的另一端。保持远见和领导力。',rv:'逆位暗示远征遭遇挫折，计划执行不顺利。可能遇到物流或团队协作问题。',
 lu:'正位预示异地恋或旅行中发展的感情有良好前景。',lr:'逆位提醒感情中的远距离问题可能比你预想的更大。',cu:'正位代表业务扩张和国际合作的好时机。',cr:'逆位提醒扩张计划可能遇到阻力，检查执行细节。',
 fu:'正位暗示外贸或海外投资带来的财务回报。',fr:'逆位提醒计划外开支可能打乱财务预测。预留缓冲金。',hu:'正位鼓励将健康习惯融入旅行和出差计划中。',hr:'逆位提醒旅途中的健康风险，做好预防措施。',
 ru:'正位预示与远方的人脉建立有价值的联系。',rr:'逆位提醒过度扩张社交圈可能导致精力分散。'},
{id:25,a:'minor',n:'权杖四',s:'\u{1F3E1}',nm:'权杖4',uk:'庆祝|和谐|家园|安定',rk:'不安|家庭冲突|过渡|不稳定',

 lu:'正位暗示对目前感情状态的厌倦或对追求者无动于衷。',lr:'逆位提醒你终于开始注意到那个一直在身边的人。',cu:'正位代表职业倦怠期，对现有工作的麻木和无聊。',cr:'逆位暗示新的职业机会出现了，别因为惯性而忽略它。',
 fu:'正位提醒你可能忽视了眼前的理财机会。睁开眼看看。',fr:'逆位象征从财务麻木中醒来。是时候整理理财计划了。',hu:'正位提醒情绪低落的漠然感正在侵蚀你的健康活力。',hr:'逆位预示活力的回归。是时候从沙发上站起来活动了。',
 ru:'正位暗示你在社交中处于被动甚至冷淡的状态。',rr:'逆位提醒别人的关心并非理所当然。回应那些善意吧。'},
{id:40,a:'minor',n:'圣杯五',s:'\u{1F622}',nm:'圣杯5',uk:'失落|悲伤|遗憾|关注所失',rk:'接受|恢复|转向希望|感恩所剩',
 up:'身披黑斗篷,低头于哀伤。面前的三杯被打翻。沉浸在失去中,却忽略了身后仍竖立的两杯。正视悲伤,但不要忘记你仍拥有的。',rv:'逆位暗示终于从失落中抬起头,看到了身后的希望。接受过去,转向未来。',
 lu:'正位暗示感情中的失落和心痛。可能是分手或期望落空。',lr:'逆位提醒已经慢慢走了出来。伤口正在结痂。',cu:'正位代表工作上的挫败感。项目失败或错失晋升。',cr:'逆位预示心态的转变。职场的打击让你学到了宝贵的教训。',
 fu:'正位暗示财务损失带来的忧虑。别只看损失的部分。',fr:'逆位提醒财务正在触底反弹。守住剩下的是首要任务。',hu:'正位提醒失落的情绪对身体的影响。你需要好好休息。',hr:'逆位暗示心态好转带动了身体的恢复。一切都在变好。',
 ru:'正位暗示人际中的失落或被遗弃感。你并不孤单。',rr:'逆位预示愿意接受朋友的安慰了。打开心门吧。'},
{id:41,a:'minor',n:'圣杯六',s:'\u{1F33C}',nm:'圣杯6',uk:'怀旧|纯真|给予|童年回忆',rk:'沉溺过去|逃避现实|依赖|停滞',
 up:'一人递花给孩童,简单纯粹的善意与温馨。怀旧的气氛包裹着你。也许是老友重逢,或从过去的回忆中汲取温暖。',rv:'逆位暗示过分沉溺过去无法前行。对旧爱的留恋或对成长的恐惧正在拖累你。',
 lu:'正位暗示旧情人或童年玩伴的回归。一段纯真的感情。',lr:'逆位提醒不要活在过去。前任就是前任,向前看。',cu:'正位代表回归初心,用最纯粹的热情面对手头的工作。',cr:'逆位提醒不要沉溺于过去的辉煌。拥抱变化。',
 fu:'正位暗示与旧友合作或回到老本行带来的财务机会。',fr:'逆位提醒过时的理财方法不再适用。更新你的财务认知。',
 hu:'正位鼓励回忆童年时期纯粹的快乐。恢复简单的生活习惯。',hr:'逆位提醒不要回避成年人的健康责任。定期体检不能忘。',
 ru:'正位预示老友重逢或童年圈子的回归。温暖而踏实。',rr:'逆位提醒过去的人际关系模式在当下可能已经不适用。'},
{id:42,a:'minor',n:'圣杯七',s:'\u{1F308}',nm:'圣杯7',uk:'幻想|选择|愿望|迷幻',rk:'现实|清晰|做出选择|破灭',
 up:'七个灿烂的圣杯悬浮空中,装着各色欲望与幻想。面临眼花缭乱的选择。但要警惕哪些是真实且可持续的。不要被表面光彩迷惑。',rv:'逆位暗示华丽的幻想正在破灭,你终于看清什么才是真正想要的。做出明确抉择。',
 lu:'正位暗示在多位追求者或情感选项中眼花缭乱。想清楚你要什么。',lr:'逆位提醒幻想破灭是好的。现在你知道谁是真心的了。',cu:'正位代表多重职业机会带来的选择困难。评估每个的真实性。',cr:'逆位暗示透过浮华的offer看清了本质。做出务实的选择。',
 fu:'正位提示不要被暴富的故事迷惑。保持清醒判断。',fr:'逆位代表破除了财富幻想。脚踏实地更安心。',hu:'正位提醒追求不切实际的健康目标反而会失望。',hr:'逆位暗示终于接受了现实的身体状况并开始务实行动。',
 ru:'正位暗示在复杂的人际迷雾中难以分清敌友。',rr:'逆位预测人际幻象正在散去。真正的朋友会留下的。'},
{id:43,a:'minor',n:'圣杯八',s:'\u{1F6B6}',nm:'圣杯8',uk:'离开|追寻更高意义|舍弃|启程',rk:'恐惧离开|徘徊|回归|漫无目的',
 up:'转身离开垒好的圣杯,朝荒凉的远方前行。意识到当前的堆砌已无法满足内在需求。勇敢舍弃,追寻更深远的意义。',rv:'逆位暗示害怕离开舒适区,或离开后发现前方迷茫。也许你需要的就在原地。',
 lu:'正位预示勇敢离开一段不再满足的关系,向着真正的幸福出发。',lr:'逆位提醒你可能因为害怕孤单而留在错的人身边。',cu:'正位代表潇洒离开不适合的工作。寻找真正热爱的事业。',cr:'逆位提醒裸辞前先想好后路。冲动是魔鬼。',
 fu:'正位暗示放弃高薪但痛苦的工作去追寻自由。',fr:'逆位提醒逃离财务压力的路上不要做盲目选择。',hu:'正位鼓励离开不健康的环境或习惯去寻找更好的生活。',hr:'逆位提醒离开时需要计划。盲目的转变可能更糟。',
 ru:'正位暗示离开消耗性的社交圈去寻找更真实的连接。',rr:'逆位提醒你可能在逃避而非追寻。厘清动机。'},
{id:44,a:'minor',n:'圣杯九',s:'\u{1F60A}',nm:'圣杯9',uk:'愿望实现|满足|美梦成真|舒适',rk:'失望|虚荣|贪心不足|内心空虚',
 up:'九个圣杯完美陈列身后,满足地坐在正中。这就是许愿牌——你的心声被宇宙聆听,愿望正在实现的路上。享受这份如愿以偿。',rv:'逆位暗示愿望落空或即使愿望成真也感到莫名的空虚。物质满足≠内心充实。',
 lu:'正位预示感情中的愿望正在实现。你喜欢的人也正走向你。',lr:'逆位提醒即使得到了人也不一定得到心。审视真正缺失的是什么。',cu:'正位代表职业理想的实现。你期待的机会终于来了。',cr:'逆位提醒得到了想要的职位却感到不如预期。重新定义成功。',
 fu:'正位象征财务愿望的达成。投资回报或期望收入正在兑现。',fr:'逆位提醒物质的满足没有带来预期的快乐。' ,hu:'正位鼓励庆祝你健康路上的每一个愿望达成。你做到了。',hr:'逆位提醒目标的达成不要成为放纵的理由。保持好习惯。',
 ru:'正位预示在朋友中的受欢迎度达到顶峰。真诚带来回响。',rr:'逆位提醒表面的热闹可能掩盖了真实的孤独。'},
{id:45,a:'minor',n:'圣杯十',s:'\u{1F308}\u{1F308}',nm:'圣杯10',uk:'圆满家庭|幸福巅峰|归属感|理想',rk:'家庭不和|破碎梦|疏离|理想破灭',
 up:'一家人在彩虹下仰望圣杯,终极的情感圆满和家庭幸福。找到归属感,被毫无保留的爱包围。这是大团圆的理想画面。',rv:'逆位暗示家庭冲突或理想中的幸福画面正在崩塌。现实与期望的落差带来失望。',
 lu:'正位预示感情的完美结局——结婚、共筑爱巢、家庭美满。',lr:'逆位提醒家庭干涉或内在矛盾正在威胁感情的根基。',cu:'正位代表团队的完美凝聚力和归属感。你找到了最佳的工作氛围。',cr:'逆位提醒职场团队的深层矛盾。表面和谐可能掩盖了不满。',
 fu:'正位暗示家庭财富的圆满。可能获得家族支持或房产。',fr:'逆位提醒家庭财务纠纷或房产相关的矛盾。',hu:'正位鼓励和家人一起享受健康的生活。幸福的家庭是最好的药。',hr:'逆位提醒家庭紧张关系正在影响你的身心健康。',
 ru:'正位预示着最理想的人际归属。你被家人和挚友深深爱着。',rr:'逆位提醒家庭圈子的矛盾和疏离需要正视并修复。'},
{id:46,a:'minor',n:'圣杯侍从',s:'\u{1F9DD}',nm:'圣杯侍',uk:'梦幻|直觉|情感初萌|艺术家',rk:'情绪化|不切实际|逃避|暗恋',
 up:'手持圣杯的梦幻少年,充满艺术灵感和柔情。新的情感种子正在萌发。跟随灵感的波纹,它是上天的低语。',rv:'逆位暗示情感过于泛滥而不切实际。陷入幻想的暗恋或逃避现实的情绪海洋中。',
 lu:'正位暗示甜蜜的暗恋或初萌的浪漫情愫。这是心动的季节。',lr:'逆位提醒沉浸在幻想中太久。要么表白要么清醒。',cu:'正位代表新灵感和创意的萌芽期。适合从事艺术类工作。',cr:'逆位提醒想法需要接地气的执行计划。光想不做一场空。',
 fu:'正位暗示依靠直觉和创意可能带来意外的财务惊喜。',fr:'逆位提醒白日做梦并不能赚钱。把灵感商业化才能变现。',hu:'正位鼓励通过艺术和创造性的方式疗愈身心。',hr:'逆位提醒过度情绪化可能影响身体健康。需要理性介入。',
 ru:'正位预示一个温柔敏感的新朋友进入了你的圈子。',rr:'逆位提醒不要对他人的善意产生过度的情感依赖。'},
{id:47,a:'minor',n:'圣杯骑士',s:'\u{1F40E}\u{1F4A7}',nm:'圣杯骑',uk:'浪漫邀约|理想派|追求梦想|创造力',rk:'幻灭|欺骗|不靠谱|空头支票',
 up:'骑士优雅地举杯前行,象征浪漫的邀约和带着理想的追寻。跟随内心的呼唤,你的浪漫主义将吸引美好事物。',rv:'逆位暗示承诺的空洞或浪漫表象下的欺骗。过于理想化导致伤害。',
 lu:'正位预示一场浪漫的告白或约会。如诗如画的爱情体验。',lr:'逆位提醒甜言蜜语未必是真。用心感受而非用耳朵听。',cu:'正位代表与创意和美学相关的职业机会正在走近。',cr:'逆位提醒注意职场中的空头支票和不靠谱的承诺。',
 fu:'正位暗示与美、艺术、创意相关的财务机会。',fr:'逆位提醒警惕华而不实的投资方案。包装好看不一定有用。',hu:'正位鼓励滋养你的心灵。精神层面的满足对健康至关重要。',hr:'逆位提醒幻想中的健康方案不可信。回归科学和常规。',
 ru:'正位预示一个浪漫的理想主义者走进你的社交圈。',rr:'逆位提醒小心表面迷人但内在空洞的社交关系。'},
{id:48,a:'minor',n:'圣杯王后',s:'\u{1F478}\u{1F4A7}',nm:'圣杯后',uk:'共情|直觉|慈爱|艺术',rk:'多愁善感|依赖|情绪勒索|自我牺牲',
 up:'王后手持精美的圣杯,静坐水边。强大的共情力和深邃直觉让她如鱼得水。慈爱和艺术感知力处于巅峰。用温暖化解一切。',rv:'逆位暗示过度共情变成自我牺牲。可能情绪反刍或被他人情绪绑架。设立情绪边界。',
 lu:'正位预示你在感情中展现了最温柔体贴的一面。你是对方的港湾。',lr:'逆位提醒不要因为过度共情和付出而失去自我。' ,cu:'正位代表用软实力和情感智慧化解职场矛盾。同理心是你最强的武器。',cr:'逆位提醒职场中的情绪化反应可能损害你的专业形象。',
 fu:'正位暗示通过关怀和滋养他人的方式获得的收入。服务业和护理业收获。',fr:'逆位提醒因同情心和怜悯而乱花钱。爱心和财务要分开管理。',hu:'正位提醒注意通过共情来了解身体的真实需求。多喝水,滋养自己。',hr:'逆位提醒情绪疾患可能找上门。你需要的是专业帮助,不是硬扛。',
 ru:'正位预示作为朋友圈中的知心姐姐/哥哥角色。人人都想向你倾诉。',rr:'逆位提醒你做了太久的情绪垃圾桶。是时候给自己充充电了。'},
{id:49,a:'minor',n:'圣杯国王',s:'\u{1F934}\u{1F4A7}',nm:'圣杯王',uk:'情感成熟|外交|睿智|慈悲',rk:'情感操控|阴郁|成瘾|情绪不稳',
 up:'国王稳坐水中央,情感成熟到能驾驭最深的海啸。外交手腕和慈悲之心兼备。用圆融的智慧平衡情感与理智。',rv:'逆位暗示情感上的不成熟。可能通过情绪操控他人,或陷入成瘾和阴郁的泥潭。',
 lu:'正位预示一个情感成熟且充满魅力的对象,或是你在这段感情中表现出的成熟。',lr:'逆位提醒情感操控正在毁掉关系。爱不是控制。',cu:'正位代表以情商人脉取胜。在管理中展现出非凡的外交智慧。',cr:'逆位提醒职场中用情绪绑架团队和你自己。收起你的阴暗面。',
 fu:'正位暗示通过广泛的社交网络和成熟的人脉实现的财务自由。',fr:'逆位提醒成瘾性消费或不良的金钱习惯正在侵蚀你。',hu:'正位鼓励通过情感管理和心理成熟度达到身心的平衡。',hr:'逆位提醒成瘾问题需要认真面对。寻求专业帮助不是耻辱。',
 ru:'正位预示你在复杂的群体动态中扮演了定海神针的角色。',rr:'逆位提醒小心你在团体中的阴暗操作被人识破。保持真诚。'},

{id:50,a:'minor',n:'宝剑王牌',s:'\u2694\uFE0F',nm:'宝剑1',uk:'清晰|新思维|真理|突破',rk:'混乱思维|错误判断|模糊|偏见',
 up:'宝剑高举,斩断迷雾,带来绝对的清晰和真理。新的思维模式已经诞生。果断运用你的理智做出正确判断,头脑是不败的利器。',rv:'逆位暗示思维混乱或错误的判断正在误导你。可能被偏见和情绪左右了头脑。',
 lu:'正位暗示用清醒的头脑审视感情,真相即将大白。',lr:'逆位提醒不要被表象或偏见误导。客观看待感情。',cu:'正位代表清晰的职业规划。新的职场思维和策略正在成型。',cr:'逆位提醒决定可能是基于错误信息。先澄清事实。',
 fu:'正位暗示通过对账目和数据的清晰审视避免损失。',fr:'逆位提醒草率的财务决定是由于信息不足。',hu:'正位鼓励清醒理智地面对体检报告。知识就是力量。',hr:'逆位提醒不要自己吓自己,先问医生而非百度。',
 ru:'正位预示人际中的清晰沟通。直截了当反而最高效。',rr:'逆位提醒言辞过于尖锐可能会无意中伤害他人。'},
{id:51,a:'minor',n:'宝剑二',s:'\u{1F9D8}\u{200D}\u{2642}\u{FE0F}',nm:'宝剑2',uk:'僵局|困难抉择|回避|平衡',rk:'打破僵局|信息泄露|被迫选择|无法再回避',
 up:'蒙眼女子双剑交叉于胸前。那是一个自我保护的回避姿态。你正处于困难的抉择僵局中,但回避无法持久。摘下眼罩面对现实吧。',rv:'逆位暗示僵局被打破,隐藏信息泄露迫使你必须做出决定。无法再继续假装看不见了。',
 lu:'正位暗示在感情抉择中左右为难或刻意回避。',lr:'逆位提醒压死骆驼的最后一根稻草已经落下。做决定吧。',cu:'正位代表职业选择的进退两难。保持现状还是跳槽？',cr:'逆位暗示外部事件逼你做出了职业上的抉择。',
 fu:'正位暗示在两个投资或花钱方案之间陷入僵局。',fr:'逆位提醒再不做决定可能会面临更大的财务压力。',hu:'正位提醒拒绝面对健康问题是最大的问题。',hr:'逆位暗示终于决定面对那个一直回避的健康隐患。',
 ru:'正位提示你在两人之间或两派之间进退维谷。',rr:'逆位预示真相揭开使你的立场被迫明朗化。'},
{id:52,a:'minor',n:'宝剑三',s:'\u{1F494}',nm:'宝剑3',uk:'心碎|悲伤|背叛|真相的刺痛',rk:'治愈|释怀|恢复|原谅',
 up:'三剑穿心。这是一张赤裸描写心碎、背叛和巨大悲伤的牌。面对残酷的现实。允许自己感受痛苦,但不要否认它正在发生。',rv:'逆位暗示伤口开始愈合。痛苦虽然仍在,但你正在学习与伤疤共存并向前走。',
 lu:'正位预示情感中的巨大心碎——分手、背叛或失望。',lr:'逆位提醒伤口正在结痂。给自己时间和空间去愈合。',cu:'正位代表职场上的挫败和伤害。被同事背叛或项目被否。',cr:'逆位暗示正在从职场创伤中恢复。更坚强的你会回来。',
 fu:'正位暗示财务上的重大损失或被骗。痛苦但必须面对。',fr:'逆位提醒损失的金钱正在成为变贵的学费。',hu:'正位提醒悲伤的情绪对心脏和免疫系统的影响。允许释放。',hr:'逆位暗示身心的痛苦正在减轻。疗愈已经开始。',
 ru:'正位暗示被朋友或亲近的人所伤。那份痛是真实的。',rr:'逆位提醒虽然痛苦,但原谅是为了放过自己。'},
{id:53,a:'minor',n:'宝剑四',s:'\u{1F634}',nm:'宝剑4',uk:'休息|恢复|冥想|内省',rk:'失眠|倦怠|强制休息|无法平静',
 up:'骑士在教堂静躺休息。经历激战后需要休养生息。抽离混乱的局面,让身心全面重置。退一步是为了更好地反击。',rv:'逆位暗示你无法真正休息,内心翻江倒海。或被强制叫回了战场。',
 lu:'正位暗示感情中需要暂时的冷淡期和冷静空间。',lr:'逆位提醒冷战期过长会变成真正的分开。',cu:'正位代表休个假或暂时放下繁重工作恢复精力。',cr:'逆位提醒即使在休假也无法停止对工作的焦虑。',
 fu:'正位暗示按兵不动,让账户休息一下。不要频繁操作。',fr:'逆位提醒财务焦虑让你无法好好休息。做个计划然后放手。',hu:'正位警告你的身体急需深度休息。躺着就是生产力。',hr:'逆位提醒失眠和焦虑的恶性循环需要专业干预。',
 ru:'正位暗示远离社交喧嚣,享受一段安静的自我时光。',rr:'逆位提醒过度自我封闭反而会滋生新的问题。'},
{id:54,a:'minor',n:'宝剑五',s:'\u{1F3F3}\u{FE0F}',nm:'宝剑5',uk:'惨胜|冲突|羞辱|不光彩',rk:'和解|放下|寻求和平|止损',
 up:'胜者捡起败者的剑,留下一片狼藉和离去的背影。即使赢了也是惨胜。思考这次争斗的意义:赢了口角输了人心,值得吗？',rv:'逆位暗示混乱结束后开始寻求和解与放下。意识到冲突的代价远大于预期。',
 lu:'正位暗示感情中的争吵。即使吵赢了也输了感情。',lr:'逆位提醒终于愿意放下武器去拥抱对方。和解吧。',cu:'正位代表职场中的办公室政治和恶性竞争。',cr:'逆位暗示冲突即将平息。学会与不同的人共处是进步。',
 fu:'正位提醒通过争斗或法律手段维权的成本可能高于收益。',fr:'逆位提醒止损离场比纠缠于失败的交易更有智慧。',hu:'正位提醒长期冲突带来的心理压力正在压垮你。',hr:'逆位暗示和解的心态让身心紧绷的弦松了下来。',
 ru:'正位提示你可能在社交互动中太过争强好胜。',rr:'逆位预示着放下输赢,人际氛围正在回暖。'},
{id:55,a:'minor',n:'宝剑六',s:'\u{26F5}\u{2694}',nm:'宝剑6',uk:'过渡|疗伤之旅|向前|携带创伤前行',rk:'拒绝前行|更糟的境遇|被困|无路可退',
 up:'船夫载着插满利剑的船,缓缓渡向彼岸。带着创伤继续前行,从一个艰难的境遇向平静过渡。这是忧郁但必要的旅程。',rv:'逆位暗示拒绝离开当前的痛苦状态,或到达了更糟的境遇中。被困住了。',
 lu:'正位暗示带着过去的伤痛慢慢过渡到新的感情阶段。',lr:'逆位提醒你可能因为困难而退回了旧的关系中。',cu:'正位代表渡过职业的空窗期。从旧工作飘向新机会的途中。',cr:'逆位提醒可能从一个火坑跳入另一个。慎重选择下一站。',
 fu:'正位提示你正在从财务困境中慢慢渡过,平静就在前方。',fr:'逆位提醒不要做拆东墙补西墙的财务操作。',hu:'正位暗示慢慢从疾病中康复的过渡期。平稳就是好消息。',hr:'逆位提醒病情没有如期待中好转。保持耐心,航程还未结束。',
 ru:'正位预示终于要离开一段复杂的社交环境,飘向平静。',rr:'逆位提醒离开旧圈子后,面临的新环境可能并不理想。'},
{id:56,a:'minor',n:'宝剑七',s:'\u{1F3C3}\u{200D}\u{2642}',nm:'宝剑7',uk:'策略|灵活|智取|隐秘行动',rk:'暴露|失败|自作聪明|搬石砸脚',
 up:'趁夜偷走足够数量的剑。需要运用智慧和策略绕开障碍。有时正面强攻不如智取的曲线救国。但要意识到你无法瞒过所有人。',rv:'逆位暗示计谋败露,自以为是的小聪明反被识破。或被指说谎和欺骗。',
 lu:'正位暗示用一点小策略吸引对方的注意。但不要太过了。',lr:'逆位提醒小心机很容易被看穿。真诚才是必杀技。',cu:'正位代表找到巧妙的捷径或绕开职场条条框框的智慧。',cr:'逆位提醒小聪明的操作被公司发现了。你正在失去信用。',
 fu:'正位暗示通过信息差或轻巧的策略获利。不鸣则已一鸣惊人。',fr:'逆位提醒投机取巧必然被反噬。赚钱要走正道。',hu:'正位鼓励用聪明的方式绕过健康障碍。找到适合你的独特方法。',hr:'逆位提醒走捷径的健康骗局不仅无效还可能反噬。',
 ru:'正位提示在复杂的社交网中巧妙穿梭,让人猜不透。',rr:'逆位暗示你的小心思已经被圈子看穿了。坦诚相待吧。'},
{id:57,a:'minor',n:'宝剑八',s:'\u{1F512}',nm:'宝剑8',uk:'被束缚|自我设限|无助|困境',rk:'解放|挣脱|解除束缚|自主',
 up:'蒙眼被缚,被环绕的剑困住。但束缚大多是自我的心理监狱。停止告诉自己"我做不到"。看清限制,枷锁从来不是真正的铁链。',rv:'逆位暗示挣脱心理束缚的关键时刻。终于意识到是自己困住了自己,并砸开牢笼。',
 lu:'正位提醒你在感情中感到束缚和无助,但这主要是你的心理障碍。',lr:'逆位征兆你终于走出了对某人的执念,获得了感情上的解放。',cu:'正位代表在工作中感到被环境和规则死死捆住。' ,cr:'逆位暗示跳出了自我设限。你发现那些规则原来并没有那么铁。',
 fu:'正位暗示被财务压力困住,感到无能为力。但事实可能没你想的那么糟。',fr:'逆位预测财务上的束缚被你亲手解开。原来是虚惊一场。',hu:'正位提醒思想上的过度焦虑限制了你的身体活力。',hr:'逆位代表摆脱了对某种疾病的过度恐惧。身心的枷锁同解开。',
 ru:'正位提示你在人际圈中画地为牢。其实大家没那么关注你。',rr:'逆位预示你主动打破社交障碍。轻松做自己就好。'},
{id:58,a:'minor',n:'宝剑九',s:'\u{1F630}',nm:'宝剑9',uk:'噩梦|焦虑|内疚|失眠',rk:'希望|释怀|重拾信心|接受帮助',
 up:'从噩梦中惊醒坐起,被巨大的忧虑和内疚淹没。深夜的思维反刍是最大的敌人。你担心的多数事情并不会真实发生。',rv:'逆位暗示终于从焦虑的漩涡中爬出来。情况没有你想象得那么糟。释怀和求救正在发生。',
 lu:'正位暗示感情中的猜疑和极度不安正在吞噬你。',lr:'逆位提醒找人聊聊吧,你的焦虑需要一个出口。',cu:'正位代表工作压力和deadline带来的无尽噩梦。',cr:'逆位暗示压力的顶点已经过去。失控感正在消退。',
 fu:'正位提示对财务状况的极度焦虑,甚至夜里都睡不踏实。',fr:'逆位提醒最坏的情况往往被你的大脑夸大了十倍。',hu:'正位警示你的心理焦虑正转化为具体的身体症状。',hr:'逆位暗示焦虑的围困开始退散。你的求助得到了有效回应。',
 ru:'正位提醒过度的社交焦虑或对他人的内疚感。',rr:'逆位代表决定放下对他人的过度在意。释放对自己的苛责。'},
{id:59,a:'minor',n:'宝剑十',s:'\u{1F6AB}',nm:'宝剑10',uk:'终结|背叛|谷底|无路可退',rk:'幸存|复苏|吸取教训|最坏的已过去',
 up:'十剑穿身,伏倒在地。这是最著名的"毁天灭地"牌。一个痛苦的毁灭性终结。但请记住,死寂的黑暗之后必有黎明的第一缕光。没有比谷底更糟的了。',rv:'逆位暗示最艰难的时刻已经过去,从绝境中复苏。伤口还在疼但命保住了。',
 lu:'正位预示一段感情的最惨痛终结。几乎是被摧毁般的痛苦。',lr:'逆位提醒死里逃生。无论多痛你居然挺过来了,往前走。',cu:'正位代表职业上的颠覆性打击。被裁员或事业完全崩盘。',cr:'逆位暗示正在从职业废墟中爬起来。重建虽然慢但开始了。',
 fu:'正位提示财务上的崩溃。破产或即将归零的巨大损失。',fr:'逆位提醒虽然输惨了但保留了东山再起的种子。',hu:'正位警告身体可能面临最严峻的考验。',hr:'逆位提醒死神擦肩而过。你避开了最差的结果,感谢命运的恩赐。',
 ru:'正位暗示人际圈的彻底坍塌。被伤害或被集体抛弃的痛苦。',rr:'逆位预测最惨的社交风暴已经过去。留下的都是真心待你的人。'},
{id:60,a:'minor',n:'宝剑侍从',s:'\u{1F575}\u{FE0F}',nm:'宝剑侍',uk:'求知|调查|警惕|言语灵敏',rk:'窥探|八卦|缺心眼|嘴毒',
 up:'手持宝剑警戒的年轻学徒。思维敏捷,求知若渴。正在搜集真相,保持在线状态。利用你的口才和逻辑去打破砂锅问到底。',rv:'逆位暗示八卦消息灵通或有攻击性的毒舌。不小心说了伤人的实话。',
 lu:'正位暗示在感情中敏锐地试探对方。小心思很活络。',lr:'逆位提醒毒舌和冷嘲热讽正在伤害爱你的人。',cu:'正位代表对新知识的渴望和对信息的敏锐搜集能力。',cr:'逆位提醒注意职场上的流言蜚语。祸从口出。',
 fu:'正位提示多调查多学习,但知识换财富需要行动。',fr:'逆位提醒因闲聊透露出的财务信息可能被利用。',hu:'正位鼓励钻研健康知识,但不要疑病症上身。',hr:'逆位提醒不要因为看了一堆养生文章就吓自己。',
 ru:'正位暗示在社交中消息灵通,游走在信息流的潮头。',rr:'逆位提醒管住你的嘴。不要背后传闲话。'},
{id:61,a:'minor',n:'宝剑骑士',s:'\u{1F3C7}',nm:'宝剑骑',uk:'犀利|冲入战场|雷厉风行|狠',rk:'鲁莽|暴力|不计后果|无谋',
 up:'骑士挥舞宝剑不顾一切地冲锋,勇气和决心爆表。面对棘手局面,需要断然的判断和果断一击。不怕得罪人,直指要害。',rv:'逆位暗示不计后果的猛冲带来毁灭。不顾他人感受的犀利言语像一把双刃剑。',
 lu:'正位暗示在感情中突然摊牌或发起猛烈追求。',lr:'逆位提醒这种狂风暴雨式的追求可能让人害怕。温柔点。',cu:'正位代表强势推进项目和果断的职业决策。快刀斩乱麻。',cr:'逆位提醒你的强势和鲁莽已经触碰到了团队的底线。',
 fu:'正位提示通过果断的止损或大胆的短线操作获利。',fr:'逆位警示无脑冲入市场当炮灰。先动脑再动钱。',hu:'正位暗示能用钢铁般的意志进行高强度的训练。',hr:'逆位警示运动伤害。你太急于求成了。',
 ru:'正位预示你会用犀利的言辞冲破人际的僵局。',rr:'逆位提醒你的"直爽"正在变成"伤人"。'},
{id:62,a:'minor',n:'宝剑王后',s:'\u{1F478}\u2694',nm:'宝剑后',uk:'敏锐|独立|清晰边界|智慧',rk:'孤僻|苛刻|冷暴力|压抑',
 up:'王后高坐,手握宝剑,拥有洞穿一切的犀利与极强的边界感。独立和理性的光辉在闪耀。用前所未有的清晰思维处理棘手问题。',rv:'逆位暗示理性过了头变身冷血。苛刻的态度和压抑的内心筑起了无人能破的冰墙。',
 lu:'正位暗示你在用极强的理性审视感情。有清晰的底线。',lr:'逆位提醒你的冷漠和苛刻正在把对方推入深渊。',cu:'正位代表高效和专业的判断力。你是办公室里最清醒的头脑。',cr:'逆位提醒过度严厉和不近人情的形象让同事感到压抑。',
 fu:'正位暗示通过极度理性的消费和投资策略积累财富。',fr:'逆位提醒过于苛刻的省钱方式可能让自己生活变得无趣。',hu:'正位鼓励用理智管理生活作息。你很清楚什么对身体好。',hr:'逆位提醒过度压抑的天性需要通过健康愉快的方式释放。',
 ru:'正位预示在朋友圈中保持清醒的边界感。宁缺毋滥。',rr:'逆位提醒孤独是因为你的墙垒得太高了。'},
{id:63,a:'minor',n:'宝剑国王',s:'\u{1F934}\u2694',nm:'宝剑王',uk:'权威|理智|纪律|伦理',rk:'暴政|操纵|不公|滥用权力',
 up:'国王端坐,手握正义之剑,引领伦理与秩序。最高度的理智和公允权威。用冷静而公正的判断做裁决,没人能质疑你的专业性。',rv:'逆位暗示权力和理智被误用为暴政和冷漠的操纵。利用自己的高位和信息差压制他人。',
 lu:'正位预示会有一个非常理智可靠的人走进你的感情,或以清晰的边界面对关系。',lr:'逆位提醒感情中的权威压制和冷漠。这不是爱。',cu:'正位代表业界权威的地位和无可动摇的专业度。',cr:'逆位提醒你可能在不自知的情况下做了职场暴君。',
 fu:'正位提示在投资界凭借权威信息和智力碾压获利。',fr:'逆位警示滥用内部信息或用权势进行财务欺诈的极度危险。',hu:'正位鼓励采用最权威和科学的方案治疗。不盲从不偏信。',hr:'逆位提醒高压和暴怒带来的心血管风险已超标。',
 ru:'正位暗示你在某个群体中是最受尊重的权威和意见领袖。',rr:'逆位提醒不要做一人独裁的暴君。听取别人的声音。'},

{id:64,a:'minor',n:'星币王牌',s:'\u{1FA99}',nm:'星币1',uk:'新财富|机遇|繁荣|根基',rk:'错失良机|不义之财|财务灾难|根基不稳',
 up:'云端伸出的手中躺着一枚诱人金币。物质世界崭新的机遇正浮现在你面前。抓住它将带来繁荣、安全和实际的回报。天使在敲门。',rv:'逆位暗示与财富和机遇擦肩而过。可能遇到坏账或不值得的投资机会。审视根基是否稳健。',
 lu:'正位暗示感情有扎实的物质基础,一段踏实安稳的关系开始。',lr:'逆位提醒不要用金钱衡量感情。物质保障不是全部。',cu:'正位代表绝佳的职业或投资机遇。尤其是与实体和金融相关的。',cr:'逆位提醒稳住别浪。眼前的肥肉可能是诱饵。',
 fu:'正位象征财运亨通。一笔新的收入来源或极佳的投资机会。',fr:'逆位警示错失良机或落入金钱骗局。',hu:'正位鼓励把健康投资身体这座最宝贵的"实体经济"。',hr:'逆位提醒忽视身体发出的求救信号。这是你最不能挥霍的资本。',
 ru:'正位暗示通过物质和资源建立起的坚实的社交人脉。',rr:'逆位提醒小心因利益而走近的各怀鬼胎的人。'},
{id:65,a:'minor',n:'星币二',s:'\u{267B}\u{FE0F}',nm:'星币2',uk:'平衡|变通|多任务|弹性',rk:'失衡|超支|混乱|不堪重负',
 up:'玩弄两枚金币于股掌之间,如同杂耍般的精妙平衡。生活充满变数,而你在灵活变通。同时应对多个挑战和机遇,享受这份高难度平衡。',rv:'逆位暗示杂耍玩脱了,生活收支或精力上严重失衡。被压得喘不过气。',
 lu:'正位暗示在感情和现实生活之间竭力维持平衡。',lr:'逆位提醒感情的起伏让你心力交瘁。生活已经失衡了。',cu:'正位代表同时处理多个项目,展现出极强的灵活性和时间管理力。',cr:'逆位提醒你正被多重任务压垮。优先级错了,先列清单。',

// ==================== 应用状态 ====================
let state={step:1,question:'',spread:'',cards:[],flipped:0,total:0};

// ==================== 工具函数 ====================
function $(id){return document.getElementById(id);}
function hideAll(){['questionScreen','spreadScreen','shuffleScreen','cardsScreen','reportScreen'].forEach(s=>$(s).classList.add('hidden'));}
function sf(){return crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(sf()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}

// ==================== 步骤流程 ====================
function submitQuestion(){
  const q=$('questionInput').value.trim();
  if(!q){$('questionInput').style.borderColor='#8a3040';setTimeout(()=>$('questionInput').style.borderColor='#4a3060',1200);return;}
  state.question=q;
  state.step=2;
  hideAll();$('spreadScreen').classList.remove('hidden');
  updateSteps();
}

function selectSpread(type){
  state.spread=type;
  state.step=3;
  hideAll();$('shuffleScreen').classList.remove('hidden');
  updateSteps();
  doShuffle();
}

function updateSteps(){
  const STEPS=['提问','选阵','洗牌','翻牌','解读'];
  const steps=document.querySelectorAll('.step');
  steps.forEach((el,i)=>{
    el.className='step';
    if(i+1<state.step)el.classList.add('done');
    if(i+1===state.step)el.classList.add('active');
  });
}

// ==================== 洗牌动画 ====================
function doShuffle(){
  const cfg=SPREADS[state.spread];
  const total=78;
  const dur=2400;
  const interval=60;
  const item=$('shuffleCardItem');
  const hint=$('shuffleHint');
  const emojis=CD.map(c=>c.s);
  const names=CD.map(c=>c.n);
  let count=0;
  hint.textContent='宇宙正在为你洗牌...';
  item.classList.add('visible');
  const iv=setInterval(()=>{
    const ri=Math.floor(sf()*total);
    item.textContent=emojis[ri];
    if(count<10)hint.textContent='宇宙正在为你洗牌...';
    else if(count<20)hint.textContent='命运之力正在汇聚...';
    else hint.textContent='牌灵正在苏醒...';
    count++;
  },interval);
  setTimeout(()=>{
    clearInterval(iv);
    item.classList.remove('visible');
    dealCards();
  },dur);
}

// ==================== 抽牌 & 翻牌 ====================
function dealCards(){
  const cfg=SPREADS[state.spread];
  state.total=cfg.count;
  state.flipped=0;
  
  // 随机抽牌
  const pool=shuffle(CD);
  state.cards=[];
  const used=new Set();
  for(let i=0;i<cfg.count;i++){
    let idx;
    do{idx=Math.floor(sf()*78);}while(used.has(idx));
    used.add(idx);
    const card=pool[idx];
    state.cards.push({
      ...card,
      reversed:sf()<0.5,
      position:i,
      posName:cfg.positions[i],
      posDesc:cfg.descs[i]
    });
  }
  
  state.step=4;
  hideAll();$('cardsScreen').classList.remove('hidden');
  updateSteps();
  renderCards();
}

function renderCards(){
  const cfg=SPREADS[state.spread];
  const container=$('cardsContainer');
  const isCross=state.spread==='cross';
  const isCeltic=state.spread==='celtic';
  
  if(isCross){
    container.className='cards-cross';
    container.innerHTML='';
    const posMap=['cross-center','cross-top','cross-bottom','cross-left','cross-right'];
    state.cards.forEach((c,i)=>{
      const slot=document.createElement('div');
      slot.className='cross-slot '+posMap[i];
      slot.innerHTML=`
        <div class="slot-label">${c.posName}</div>
        <div class="card-inner" id="cardInner${i}" onclick="flipCard(${i})">
          <div class="card-back-mini"><div class="back-icon">\u2728</div><div class="back-tap">轻触翻牌</div></div>
          <div class="card-front-mini"><div class="mini-symbol">${c.s}</div><div class="mini-name">${c.nm}·${c.n}</div><div class="mini-pos ${c.reversed?'mini-reversed':'mini-upright'}">${c.reversed?'逆位':'正位'}</div></div>
        </div>`;
      container.appendChild(slot);
    });
  }else if(isCeltic){
    // For Celtic Cross, use a simplified vertical layout
    container.className='cards-grid';
    container.innerHTML='';
    state.cards.forEach((c,i)=>{
      const slot=document.createElement('div');
      slot.className='card-slot';
      slot.innerHTML=`
        <div class="slot-label">${i+1}. ${c.posName}</div>
        <div class="card-inner" id="cardInner${i}" onclick="flipCard(${i})">
          <div class="card-back-mini"><div class="back-icon">\u2728</div><div class="back-tap">轻触翻牌</div></div>
          <div class="card-front-mini"><div class="mini-symbol">${c.s}</div><div class="mini-name">${c.nm}·${c.n}</div><div class="mini-pos ${c.reversed?'mini-reversed':'mini-upright'}">${c.reversed?'逆位':'正位'}</div></div>
        </div>`;
      container.appendChild(slot);
    });
  }else{
    container.className='cards-grid';
    container.innerHTML='';
    state.cards.forEach((c,i)=>{
      const slot=document.createElement('div');
      slot.className='card-slot';
      slot.innerHTML=`
        <div class="slot-label">${c.posName}</div>
        <div class="card-inner" id="cardInner${i}" onclick="flipCard(${i})">
          <div class="card-back-mini"><div class="back-icon">\u2728</div><div class="back-tap">轻触翻牌</div></div>
          <div class="card-front-mini"><div class="mini-symbol">${c.s}</div><div class="mini-name">${c.nm}·${c.n}</div><div class="mini-pos ${c.reversed?'mini-reversed':'mini-upright'}">${c.reversed?'逆位':'正位'}</div></div>
        </div>`;
      container.appendChild(slot);
    });
  }
  updateProgress();
}

let canFlip=true;
function flipCard(idx){
  if(!canFlip)return;
  if(idx!==state.flipped)return; // 必须按顺序
  canFlip=false;
  const inner=$('cardInner'+idx);
  inner.classList.add('flipped');
  state.flipped++;
  updateProgress();
  setTimeout(()=>{
    canFlip=true;
    if(state.flipped>=state.total){
      setTimeout(generateReport,600);
    }
  },750);
}

function updateProgress(){
  const pg=$('cardsProgress');
  if(state.flipped>=state.total){
    pg.textContent='所有牌已翻开，正在生成解读...';
  }else{
    const next=state.cards[state.flipped];
    pg.textContent='已翻开 '+state.flipped+' / '+state.total+'  ·  请翻第 '+(state.flipped+1)+' 张：'+next.posName;
  }
}

// ==================== 领域判断 ====================
function detectDomain(q){
  const d=[];
  if(/爱|情|恋|喜欢|分手|表白|暗恋|对象|前任|结婚|相亲|暧昧|男朋友|女朋友|老公|老婆/.test(q))d.push('love');
  if(/工作|事业|职|跳槽|面试|老板|同事|加薪|辞职|实习|创业|项目|升职|客户|offer/.test(q))d.push('career');
  if(/钱|财|赚|投资|债务|花销|贷款|股票|基金|工资|奖金|欠款|理财|买/.test(q))d.push('fortune');
  if(/健康|身体|病|疼|累|失眠|瘦|胖|压力|焦虑|抑郁|运动|饮食/.test(q))d.push('health');
  if(/朋友|关系|父母|家庭|相处|人际|社交|闺蜜|兄弟|亲戚/.test(q))d.push('relation');
  return d.length?d:['general'];
}

const DOMAIN_MAP={love:{key:'lu',rkey:'lr',name:'爱情'},career:{key:'cu',rkey:'cr',name:'事业'},fortune:{key:'fu',rkey:'fr',name:'财运'},health:{key:'hu',rkey:'hr',name:'健康'},relation:{key:'ru',rkey:'rr',name:'人际关系'},general:{key:'up',rkey:'rv',name:''}};

function getDomainReading(card,domain){
  if(domain==='general'){
    return card.reversed?card.rv:card.up;
  }
  const dm=DOMAIN_MAP[domain];
  return card.reversed?(card[dm.rkey]||card.rv):(card[dm.key]||card.up);
}

// ==================== 生成解读报告 ====================
function generateReport(){
  state.step=5;
  hideAll();$('reportScreen').classList.remove('hidden');
  updateSteps();
  
  const domains=detectDomain(state.question);
  const cfg=SPREADS[state.spread];
  
  let html='<div class="report-card"><h3>问题回响</h3><p>你带着内心的困惑前来——"'+escapeHtml(state.question)+'" 。塔罗的智慧愿为你点亮前行的微光，请带着开放的心，倾听宇宙的低语。</p></div>';
  
  // 牌阵总览
  html+='<div class="report-card"><h3>牌阵总览 · '+cfg.name+'</h3>';
  state.cards.forEach((c,i)=>{
    html+=`<div class="card-summary"><div class="cs-icon">${c.s}</div><div class="cs-info"><span class="cs-title">${c.nm}·${c.n}</span><span class="cs-pos">[${c.reversed?'逆位':'正位'}] ${c.posName}</span><div class="cs-tags">`;
    const tags=c.reversed?c.rk.split('|'):c.uk.split('|');
    tags.slice(0,4).forEach(t=>{html+=`<span class="cs-tag">${t}</span>`;});
    html+='</div></div></div>';
  });
  html+='</div>';
  
  // 逐牌详解
  html+='<div class="report-card"><h3>逐牌详解</h3>';
  state.cards.forEach((c,i)=>{
    const isRev=c.reversed;
    const title=isRev?'逆位':'正位';
    html+=`<h4>${c.s} ${c.nm}·${c.n}（${title}）—— ${c.posName}</h4>`;
    html+=`<p class="detail"><strong>牌阵位置含义：</strong>${c.posDesc}</p>`;
    
    // Main reading
    const mainR=isRev?c.rv:c.up;
    html+=`<p class="detail">${mainR}</p>`;
    
    // Domain readings
    if(domains.length===1&&domains[0]==='general'){
      // just the main reading is enough
    }else{
      domains.forEach(d=>{
        if(d==='general')return;
        const dm=DOMAIN_MAP[d];
        const dr=getDomainReading(c,d);
        if(dr){
          html+=`<p class="detail"><strong>[${dm.name}领域]</strong> ${dr}</p>`;
        }
      });
    }
  });
  html+='</div>';
  
  // 综合启示
  html+='<div class="report-card"><h3>综合启示</h3>';
  html+=generateSynthesis();
  html+='</div>';
  
  // 行动建议
  html+='<div class="report-card"><h3>行动建议</h3>';
  html+=generateActions();
  html+='</div>';
  
  $('reportScreen').innerHTML=html;
  
  // 底部按钮
  const footer=document.createElement('div');
  footer.className='report-footer';
  footer.innerHTML='<button class="btn btn-primary" onclick="resetAll()">重新占卜</button><div class="share-hint">长按截图保存您的专属解读</div>';
  $('reportScreen').appendChild(footer);
  
  // 滚动到顶部
  $('reportScreen').scrollIntoView({behavior:'smooth'});
}

function generateSynthesis(){
  const q=state.question;
  const cards=state.cards;
  const revCount=cards.filter(c=>c.reversed).length;
  const total=cards.length;
  const revRatio=revCount/total;
  
  let s='';
  
  // Check for major arcana concentration
  const majors=cards.filter(c=>c.a==='major');
  const majorCount=majors.length;
  
  if(majorCount>=total*0.6){
    s+=`<p>此牌阵中大阿尔卡纳牌占比极高（${majorCount}/${total}），说明你所问之事绝非偶然，命运之力正在深层运作。这不是日常琐事的困扰，而是宇宙安排的重要功课。`;
  }else if(majorCount===0){
    s+=`<p>此牌阵中全部为小阿尔卡纳牌，说明你所关注的更多是日常生活中具体的人与事。问题的根源和解决方向，都藏在你每天的选择和行动之中。</p>`;
  }else{
    s+=`<p>${majorCount}张大阿尔卡纳与${total-majorCount}张小阿尔卡纳的组合，既揭示了命运的宏观脉络，又不乏现实层面的具体指引。这是罕见的平衡牌阵。</p>`;
  }
  
  if(revRatio>0.6){
    s+=`<p>牌阵中逆位牌达到${revCount}张（${Math.round(revRatio*100)}%），这不是坏消息，而是提醒。过多的逆位暗示你此刻可能正在对抗某些本该顺应的力量，或某些内在的阻滞需要被正视。命运的逆行时刻往往是深刻内省的前奏。</p>`;
  }else if(revRatio<0.2){
    s+=`<p>牌阵中仅有${revCount}张逆位牌，总体能量顺畅。宇宙正给予你清晰的讯号——你所走的道路与你的本质是一致的。这份罕见的全正位能量是对你的肯定。</p>`;
  }
  
  // Contextual synthesis
  if(cards.length===1){
    s+=`<p>单张牌的解读最为直接。关于"${truncate(q,30)}"，`+cards[0].posName+'的位置上出现了'+(cards[0].reversed?'逆位':'正位')+cards[0].nm+'·'+cards[0].n+'。这张牌就是你此刻需要的全部指引。宇宙有时不需要复杂的话，一句就够了。';
  }else if(cards.length===3){
    const p=cards[0],n=cards[1],f=cards[2];
    s+=`<p>时间线上，<span class="highlight">${p.n}</span>揭示了过去的根源，<span class="highlight">${n.n}</span>映照出当下的真相，而<span class="highlight">${f.n}</span>则指向了未来的方向。三张牌串联起来，就是一条从"为何如此"到"将会怎样"的因果链。${n.reversed?'当下的逆位能量提醒你审视此刻的阻滞。':'当下的正位能量鼓舞你保持此刻的觉知。'}</p>`;
  }else if(cards.length===5){
    s+=`<p>十字牌阵从五个维度编织了关于"${truncate(q,25)}"的全景图：中心牌揭示了问题的真正核心，上下两张展现意识与潜意识的张力，左右两张则从时间维度勾勒因果。这是一个需要从多角度审视的复杂情境，没有简单的对错，只有更深的看见。</p>`;
  }else if(cards.length===10){
    s+=`<p>凯尔特十字是塔罗中最完整、最深刻的牌阵。十张牌如十面镜子，从根源到结果，从你的态度到环境的影响，全方位地展开了"${truncate(q,25)}"的宇宙画卷。这个牌阵的出现本身就是一种重视——你问的这个问题，值得宇宙动用最完整的智慧来回应。</p>`;
  }
  
  return s;
}

function generateActions(){
  const cards=state.cards;
  const actions=[];
  const q=state.question;
  
  if(cards.some(c=>c.n==='太阳'||c.n==='星星'||c.n==='世界')){
    actions.push('保持此刻的信心与希望。牌面的能量显示，你正走在正确的轨道上。不要因为暂时的看不清而动摇，光就在前方不远处。');
  }
  if(cards.some(c=>c.n==='倒吊人'||c.n==='隐者')){
    actions.push('给自己留出静默的时间。每天抽出15分钟独处，不刷手机不做事，就只是和自己在一起。答案往往在静默中自己浮现。');
  }
  if(cards.some(c=>c.n==='战车'||c.n==='力量'||c.n==='魔术师')){
    actions.push('将想法付诸行动。牌面显示你已经积蓄了足够的能量和资源，不要再等"完美的时机"。迈出第一步，路会在脚下展开。');
  }
  if(cards.some(c=>c.n==='节制'||c.n==='正义')){
    actions.push('寻求平衡。如果你在'+(/工作|事业/.test(q)?'事业与生活':'得与失')+'之间感到撕裂，不妨用纸笔列出两周时间日志，看清楚你的时间和精力真正流向了哪里。');
  }
  if(cards.some(c=>c.n==='死神'||c.n==='高塔')){
    actions.push('接受结束，迎接蜕变。牌阵中出现了终结的能量，这并不代表毁灭，而是旧的不去新的不来。如果有一直想断舍离的东西——一段关系、一个习惯、一份执念——现在是时候了。');
  }
  if(cards.some(c=>c.n==='女皇'||c.n==='星币九'||c.n==='星币十')){
    actions.push('善待自己的身体和感官。给自己安排一顿用心准备的美食，或一次SPA、一次散步。牌面提醒你，物质世界的丰饶是你应得的，享受它。');
  }
  if(cards.some(c=>c.n==='恋人'||c.n==='圣杯二')){
    actions.push('重视你面前的关系选择。如果涉及两个人之间的决定，请放下"他/她怎么想"的猜测，先问清楚"我怎么想"。真诚的选择胜过聪明的计算。');
  }
  if(cards.some(c=>c.a==='minor'&&(c.n.includes('宝剑')||c.n.includes('权杖')))){
    actions.push('写下来。把你大脑中盘旋的担忧、计划、愤怒或困惑，全部倒在一张纸上。当你看到它们以文字的形式安静地躺在那里时，你会发现它们没有想象中那么可怕。');
  }
  
  // Always add this
  actions.push('信任塔罗的智慧，但更要信任你自己的判断。牌面是镜子，照见的是你内心深处已有的答案。占卜的终点，永远是你自己的选择。');
  
  let ahtml='';
  actions.forEach((a,i)=>{
    ahtml+=`<div class="action-item"><strong>${i+1}.</strong> ${a}</div>`;
  });
  return ahtml;
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function truncate(s,n){return s.length>n?s.substring(0,n)+'...':s;}

function resetAll(){
  state={step:1,question:'',spread:'',cards:[],flipped:0,total:0};
  hideAll();
  $('questionInput').value='';
  $('questionScreen').classList.remove('hidden');
  updateSteps();
  window.scrollTo({top:0,behavior:'smooth'});
}

// 初始化步骤条
(function init(){
  const steps=['提问','选阵','洗牌','翻牌','解读'];
  const el=document.createElement('div');
  el.className='steps';
  steps.forEach((s,i)=>{
    const span=document.createElement('span');
    span.className='step';
    if(i===0)span.classList.add('active');
    span.textContent=s;
    el.appendChild(span);
  });
  const container=document.querySelector('.container');
  const title=container.querySelector('.title-section');
  title.insertAdjacentElement('afterend',el);
})();
